<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Director Sir & Aadhi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      width: 100vw;
      height: 100vh;
      user-select: none;        
      -webkit-user-select: none;
    }

    #comic {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    .choice-btn {
      position: fixed;
      bottom: 5%;
      font-size: clamp(0.8rem, 2.5vw, 1.1rem);
      padding: clamp(8px, 2vw, 12px) clamp(10px, 3vw, 20px);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      z-index: 10;
      display: none;
    }

    #accept-btn {
      left: 50%;
      transform: translateX(-160%);
      background-color: #4CAF50;
      color: white;
    }

    #think-btn {
      left: 50%;
      transform: translateX(-50%);
      background-color: #FFA500;
      color: white;
    }

    #deny-btn {
      left: 50%;
      transform: translateX(60%);
      background-color: #DC143C;
      color: white;
    }

    #back-link {
      position: fixed;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #FFA500;
      color: white;
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      padding: 6px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      z-index: 10;
      display: none;
    }

    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <img id="comic" src="{{ url_for('static', filename='comic_pages/comic_cover.png') }}" alt="comic page" />

  <button id="accept-btn" class="choice-btn">I accept it</button>
  <button id="think-btn"  class="choice-btn">I'll think about it…</button>
  <button id="deny-btn"   class="choice-btn">I deny it</button>
  <button id="back-link">⬅ Back to Home</button>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const images = [
      'comic_cover.png',
      'comic_1.png',
      'comic_2.png',
      'comic_3.png',
      'comic_4.png',
      'comic_choice.png',  // index 5 — choice page
      'comic_5.png',       // index 6 — think page
    ];

    let index = 0;
    const imgEl     = document.getElementById('comic');
    const acceptBtn = document.getElementById('accept-btn');
    const thinkBtn  = document.getElementById('think-btn');
    const denyBtn   = document.getElementById('deny-btn');
    const backLink  = document.getElementById('back-link');
    const baseUrl   = "{{ url_for('static', filename='comic_pages/') }}";

    function showButtons(show) {
      [acceptBtn, thinkBtn, denyBtn].forEach(btn => {
        btn.style.display = show ? 'block' : 'none';
      });
    }

    function updateImage() {
      imgEl.src = baseUrl + images[index];
      showButtons(index === 5);
    }

    // Tap left = previous, tap right = next
    document.body.addEventListener('click', (e) => {
      // Ignore clicks on any button
      if (e.target.closest('button')) return;

      // Lock navigation on choice page
      if (index === 5) return;

      const clickX = e.clientX;
      const width  = window.innerWidth;

      if (clickX > width / 2 && index < images.length - 1) {
        index++;
      } else if (clickX <= width / 2 && index > 0) {
        index--;
      }

      updateImage();
    });

    acceptBtn.onclick = () => {
      imgEl.src = baseUrl + 'comic_6.png';
      showButtons(false);
      backLink.style.display = 'block';
      runConfetti();
      alert("You can't turn back from this moment. This is forever.");
    };

    thinkBtn.onclick = () => {
      index = 6;
      updateImage();
    };

    denyBtn.onclick = () => {
      alert("This option is not available.");
    };

    backLink.onclick = () => {
      window.location.href = '/memory';
    };

    function runConfetti() {
      const end = Date.now() + 10000;
      const defaults = { startVelocity: 30, spread: 360, ticks: 250, zIndex: 1000 };
      const iv = setInterval(() => {
        if (Date.now() > end) return clearInterval(iv);
        confetti({
          ...defaults,
          particleCount: 100,
          origin: { x: Math.random(), y: Math.random() * 0.5 }
        });
      }, 200);
    }

    updateImage();
  </script>
</body>
</html>
