<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Director Sir & Aadhi</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      width: 100vw;
      height: 100vh;
    }

    #comic {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    #choice-bar {
      position: fixed;
      bottom: 5%;
      left: 0;
      width: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      z-index: 10;
    }

    .choice-btn {
      flex: 1;
      max-width: 160px;
      font-size: clamp(0.75rem, 2.5vw, 1rem);
      padding: 10px 8px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    #accept-btn { background-color: #4CAF50; color: white; }
    #think-btn  { background-color: #FFA500; color: white; }
    #deny-btn   { background-color: #DC143C; color: white; }

    #back-link {
      position: fixed;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #FFA500;
      color: white;
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      padding: 6px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      z-index: 10;
      display: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <img id="comic" src="{{ url_for('static', filename='comic_pages/comic_cover.png') }}" alt="comic page" />

  <div id="choice-bar">
    <button id="accept-btn" class="choice-btn">I accept it</button>
    <button id="think-btn"  class="choice-btn">I'll think about it…</button>
    <button id="deny-btn"   class="choice-btn">I deny it</button>
  </div>

  <button id="back-link">⬅ Back to Home</button>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const images = [
      'comic_cover.png',
      'comic_1.png',
      'comic_2.png',
      'comic_3.png',
      'comic_4.png',
      'comic_choice.png',  // index 5 — choice page
      'comic_5.png',       // index 6 — think page
    ];

    let index = 0;
    const imgEl     = document.getElementById('comic');
    const choiceBar = document.getElementById('choice-bar');
    const acceptBtn = document.getElementById('accept-btn');
    const thinkBtn  = document.getElementById('think-btn');
    const denyBtn   = document.getElementById('deny-btn');
    const backLink  = document.getElementById('back-link');
    const baseUrl   = "{{ url_for('static', filename='comic_pages/') }}";

    function showButtons(show) {
      choiceBar.style.display = show ? 'flex' : 'none';
    }

    function updateImage() {
      imgEl.src = baseUrl + images[index];
      showButtons(index === 5);
    }

    // Use touchend for mobile, click for desktop — prevents blue flash on tap
    function addTapHandler(el, fn) {
      el.addEventListener('touchend', (e) => { e.preventDefault(); fn(e); }, { passive: false });
      el.addEventListener('click', fn);
    }

    // Page navigation via tap left / tap right
    addTapHandler(document.body, (e) => {
      if (e.target.closest('button') || e.target.closest('#choice-bar')) return;
      if (index === 5) return;

      const clickX = (e.changedTouches ? e.changedTouches[0].clientX : e.clientX);
      const width  = window.innerWidth;

      if (clickX > width / 2 && index < images.length - 1) {
        index++;
      } else if (clickX <= width / 2 && index > 0) {
        index--;
      }

      updateImage();
    });

    addTapHandler(acceptBtn, () => {
      imgEl.src = baseUrl + 'comic_6.png';
      showButtons(false);
      backLink.style.display = 'block';
      runConfetti();
      alert("You can't turn back from this moment. This is forever.");
    });

    addTapHandler(thinkBtn, () => {
      index = 6;
      updateImage();
    });

    addTapHandler(denyBtn, () => {
      alert("This option is not available.");
    });

    addTapHandler(backLink, () => {
      window.location.href = '/memory';
    });

    function runConfetti() {
      const end = Date.now() + 10000;
      const defaults = { startVelocity: 30, spread: 360, ticks: 250, zIndex: 1000 };
      const iv = setInterval(() => {
        if (Date.now() > end) return clearInterval(iv);
        confetti({
          ...defaults,
          particleCount: 100,
          origin: { x: Math.random(), y: Math.random() * 0.5 }
        });
      }, 200);
    }

    updateImage();
  </script>
</body>
</html>
