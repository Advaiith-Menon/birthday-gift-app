<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Songs By Me</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#08080f;--surf:#0f0f1e;--card:rgba(255,255,255,.04);--hover:rgba(255,255,255,.065);
  --b1:rgba(255,255,255,.07);--b2:rgba(255,255,255,.13);
  --gold:#c9a84c;--gold2:#e8cc7a;--gold3:#f5e0a0;
  --txt:#f0ece3;--t2:#6e6a82;--t3:#2e2c40;
  --BAR:80px;
}
html,body{height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}

.app{position:relative;width:100%;height:100dvh;overflow:hidden;display:flex;flex-direction:column}

.orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(90px);z-index:0}
.orb1{width:600px;height:600px;top:-200px;left:-150px;background:radial-gradient(circle,rgba(201,168,76,.09),transparent 70%)}
.orb2{width:400px;height:400px;bottom:100px;right:-100px;background:radial-gradient(circle,rgba(100,70,200,.07),transparent 70%)}

.page{position:relative;z-index:1;flex:1;overflow-y:auto;overflow-x:hidden;
  padding-bottom:calc(var(--BAR) + 16px);scrollbar-width:thin;scrollbar-color:var(--b2) transparent}
.page::-webkit-scrollbar{width:3px}
.page::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}

.hdr{padding:52px 32px 24px}
.hdr-eye{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:600;
  display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hdr-eye::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(201,168,76,.35),transparent)}
.hdr-name{font-family:'Cormorant Garamond',serif;font-size:clamp(2.6rem,8vw,4.2rem);font-style:italic;
  font-weight:300;line-height:1.2;margin-bottom:8px;
  display:inline-block;width:100%;
  background:linear-gradient(135deg,var(--txt) 0%,var(--gold2) 60%,var(--txt) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-sub{font-size:12px;color:var(--t2)}

.plist{padding:0 20px 8px}

.track{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;cursor:pointer;
  border:1px solid transparent;transition:background .18s,border-color .18s,transform .18s;position:relative}
.track::after{content:'';position:absolute;bottom:0;left:76px;right:14px;height:1px;background:var(--b1)}
.track:last-child::after{display:none}
.track:hover{background:var(--hover);transform:translateX(4px);border-color:var(--b1)}
.track:hover::after,.track.now::after{display:none}
.track.now{background:linear-gradient(135deg,rgba(201,168,76,.09),rgba(100,70,200,.06));
  border-color:rgba(201,168,76,.22);transform:translateX(4px)}

.t-idx{width:28px;text-align:center;flex-shrink:0}
.t-num{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.track.now .t-num{display:none}
.eq{display:none;align-items:flex-end;justify-content:center;gap:2.5px;height:14px}
.track.now .eq{display:flex}
.eqb{width:3px;height:14px;border-radius:2px;background:var(--gold2);transform-origin:bottom center;transform:scaleY(.18);animation:eqanim var(--d) ease-in-out infinite alternate}
@keyframes eqanim{from{transform:scaleY(.18)}to{transform:scaleY(var(--s))}}

.t-art{width:54px;height:54px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--b1);position:relative;overflow:hidden;transition:all .22s}
.t-art::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 60%,transparent 100%);z-index:1;pointer-events:none}
.t-art svg{position:relative;z-index:2;flex-shrink:0}
.track:hover .t-art{transform:scale(1.07);border-color:var(--b2)}
.track.now .t-art{border-color:rgba(201,168,76,.4);box-shadow:0 0 24px rgba(201,168,76,.18)}

.t-info{flex:1;min-width:0}
.t-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;transition:color .2s}
.track.now .t-title{color:var(--gold2)}
.t-sub{font-size:11px;color:var(--t2)}
.t-dur{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}

.t-add{
  width:28px;height:28px;border-radius:50%;border:none;background:none;
  color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s,color .15s,background .15s;flex-shrink:0;
}
.track:hover .t-add{opacity:1}
.t-add:hover{color:var(--gold2);background:rgba(201,168,76,.1)}
.t-add svg{width:16px;height:16px}

/* ── BOTTOM BAR ── */
.bar{position:relative;z-index:10;flex-shrink:0;height:var(--BAR);display:flex;align-items:center;gap:12px;
  padding:0 18px;padding-bottom:env(safe-area-inset-bottom);
  background:rgba(9,9,20,.92);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  border-top:1px solid var(--b2);cursor:pointer;transition:opacity .3s}
.bar.ghost{opacity:0;pointer-events:none}
.bar-prog{position:absolute;top:0;left:0;height:2px;background:linear-gradient(to right,var(--gold),var(--gold2));border-radius:0 1px 0 0;transition:width .35s linear}

.bar-disc{width:50px;height:50px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#18182e,#0e0e1c);border:1px solid var(--b2);position:relative;overflow:hidden;transition:box-shadow .4s;will-change:transform}
.bar-disc::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.07),transparent);z-index:1}
.bar-disc svg{position:relative;z-index:2}
.bar-disc.spin{animation:spinDisc 6s linear infinite}
@keyframes spinDisc{to{transform:rotate(360deg)}}

.bar-info{flex:1;min-width:0}
.bar-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.bar-sub{font-size:11px;color:var(--t2)}

.bar-btn{background:none;border:none;color:var(--t2);cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s,transform .12s;flex-shrink:0}
.bar-btn:hover{color:var(--txt);background:rgba(255,255,255,.07)}
.bar-btn:active{transform:scale(.82)}
.bar-btn svg{width:20px;height:20px}
.bar-playbtn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--gold),#b8893a);color:#06060e;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 22px rgba(201,168,76,.5);transition:transform .15s,box-shadow .2s}
.bar-playbtn:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(201,168,76,.65)}
.bar-playbtn:active{transform:scale(.9)}
.bar-playbtn svg{width:20px;height:20px;margin-left:2px}
.bar-up{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.07);border:none;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s;flex-shrink:0}
.bar-up:hover{color:var(--txt);background:rgba(255,255,255,.13)}
.bar-up svg{width:15px;height:15px}

/* ── FULL PLAYER SHEET ── */
.sheet{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;transform:translateY(100%);transition:transform .55s cubic-bezier(.32,1,.25,1);overflow:hidden;touch-action:none}
.sheet.open{transform:translateY(0)}
.sheet::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 110% 60% at 50% -5%,rgba(201,168,76,.1),transparent 55%),radial-gradient(ellipse 70% 50% at 100% 100%,rgba(90,60,180,.07),transparent 60%)}

.sh-handle-area{padding:18px 0 0;flex-shrink:0;cursor:pointer;width:100%;display:flex;justify-content:center}
.sh-handle{width:38px;height:4px;border-radius:2px;background:var(--b2)}

.sh-close{position:absolute;top:18px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:color .2s,background .2s}
.sh-close:hover{color:var(--txt);background:rgba(255,255,255,.14)}
.sh-close svg{width:18px;height:18px}

.sh-body{flex:1;min-height:0;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;padding:6px 28px 16px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;gap:0;-webkit-overflow-scrolling:touch}
.sh-body::-webkit-scrollbar{display:none}

.vin-wrap{
  position:relative;
  width:min(56vw, 38dvh, 260px);
  aspect-ratio:1;
  flex-shrink:0;
  margin-bottom:16px;
}

.vin-glow{position:absolute;inset:-40px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(201,168,76,.22),rgba(90,60,180,.14),transparent 70%);opacity:0;transition:opacity 1.2s}
.vin-glow.on{opacity:1;animation:gbreathing 4s ease-in-out infinite}
@keyframes gbreathing{0%,100%{opacity:.45}50%{opacity:1}}

.vin-disc{
  position:absolute;
  inset:0;
  border-radius:50%;
  will-change:transform;
  background:
    radial-gradient(circle,#1e1e2a 0%,#1e1e2a 15%,transparent 15.5%),
    conic-gradient(from 0deg,
      #0d0d18 0deg 4deg,#141420 4deg 8deg,#0d0d18 8deg 12deg,#141420 12deg 16deg,
      #0d0d18 16deg 20deg,#141420 20deg 24deg,#0d0d18 24deg 28deg,#141420 28deg 32deg,
      #0d0d18 32deg 36deg,#141420 36deg 40deg,#0d0d18 40deg 44deg,#141420 44deg 48deg,
      #0d0d18 48deg 52deg,#141420 52deg 360deg);
  box-shadow:0 0 0 1px rgba(255,255,255,.04),0 0 0 3px rgba(0,0,0,.8),inset 0 0 60px rgba(0,0,0,.5),0 30px 80px rgba(0,0,0,.85);
  transition:filter .8s;
}
.vin-disc::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse 55% 35% at 26% 18%,rgba(255,255,255,.09),transparent 55%);z-index:1;pointer-events:none}
.vin-disc.spin{animation:vinSpin 7s linear infinite}
@keyframes vinSpin{to{transform:rotate(360deg)}}
.vin-disc.dim{filter:brightness(.32) saturate(.4)}

.vin-lbl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:27%;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 135deg,#3a2005,var(--gold),var(--gold2),var(--gold3),var(--gold),#3a2005);display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 2px 18px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.1)}
.vin-lbl svg{width:42%;height:42%;opacity:.9}

.tonearm{
  position:absolute;
  top:2%;
  right:-8%;
  width:38%;
  transform-origin:83% 10%;
  transform:rotate(-30deg);
  transition:transform 1.3s cubic-bezier(.25,.46,.45,.94);
  pointer-events:none;
  z-index:10;
}
.tonearm.on{transform:rotate(-5deg)}

.sh-song{width:100%;text-align:center;margin-bottom:14px}
.sh-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:clamp(1.5rem,5.5vw,2.2rem);line-height:1.15;margin-bottom:8px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.sh-title.anim{animation:tin .38s cubic-bezier(.34,1.2,.64,1) forwards}
.sh-lang{font-size:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(201,168,76,.32);padding:3px 10px;border-radius:3px;background:rgba(201,168,76,.08);display:inline-block;margin-right:8px}
.sh-type{font-size:11px;color:var(--t2)}

.sh-viz{width:100%;height:32px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.018);margin-bottom:12px;flex-shrink:0}
#viz{width:100%;height:100%;display:block}

.sh-prog{width:100%;margin-bottom:14px}
.prow{position:relative;height:26px;display:flex;align-items:center;cursor:pointer;margin-bottom:7px}
.ptrack{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:rgba(255,255,255,.08);pointer-events:none;overflow:hidden}
.pfill{height:100%;width:0%;border-radius:2px;background:linear-gradient(to right,var(--gold),var(--gold2));pointer-events:none}
.pthumb{position:absolute;left:0%;width:16px;height:16px;border-radius:50%;background:#fff;transform:translateX(-50%);box-shadow:0 0 0 3px rgba(232,204,122,.35),0 0 20px rgba(232,204,122,.5);pointer-events:none;z-index:2;transition:transform .1s}
.prow:hover .pthumb{transform:translateX(-50%) scale(1.25)}
.pinput{position:absolute;left:0;right:0;width:100%;height:26px;opacity:0;cursor:pointer;z-index:3}
.trow{display:flex;justify-content:space-between;font-size:10px;color:var(--t2);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:.04em}

.sh-ctrl{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;width:100%}
.ctr{background:none;border:none;color:var(--t2);cursor:pointer;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s,transform .12s}
.ctr:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.ctr:active{transform:scale(.82)}
.ctr.on{color:var(--gold2)}
.ctr svg{width:19px;height:19px}
.cskip{width:50px;height:50px;background:rgba(255,255,255,.06);border:1px solid var(--b1);border-radius:50%;color:var(--txt)}
.cskip:hover{background:rgba(255,255,255,.1)}
.cskip svg{width:22px;height:22px}
.cplay{width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;background:conic-gradient(from 135deg,var(--gold),var(--gold2),var(--gold3),var(--gold2),var(--gold));color:#06060e;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(232,204,122,.25),0 10px 44px rgba(201,168,76,.55);transition:transform .15s,box-shadow .2s}
.cplay::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse 65% 45% at 32% 22%,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.cplay:hover{transform:scale(1.05);box-shadow:0 0 0 1px rgba(232,204,122,.35),0 14px 54px rgba(201,168,76,.7)}
.cplay:active{transform:scale(.9)}
.cplay svg{width:30px;height:30px;position:relative;z-index:1;margin-left:3px}

.sh-vol{display:flex;align-items:center;gap:12px;width:100%}
.vico{color:var(--t3);display:flex;flex-shrink:0}
.vico svg{width:14px;height:14px}
.vwrap{flex:1;position:relative;height:22px;display:flex;align-items:center}
.vtrack{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;pointer-events:none}
.vfill{height:100%;width:80%;background:linear-gradient(to right,var(--gold),var(--gold2))}
.vinput{position:absolute;left:0;right:0;width:100%;height:22px;opacity:0;cursor:pointer;z-index:3}

.queue-btn{display:flex;align-items:center;gap:10px;margin-top:12px;width:100%;background:rgba(255,255,255,.04);border:1px solid var(--b1);border-radius:12px;padding:10px 16px;cursor:pointer;color:var(--t2);font-size:12px;font-family:'DM Sans',sans-serif;transition:background .18s,border-color .18s,color .18s}
.queue-btn:hover{background:rgba(255,255,255,.07);border-color:var(--b2);color:var(--txt)}
.queue-btn svg{width:15px;height:15px;flex-shrink:0}
.qb-label{flex:1;text-align:left;letter-spacing:.04em}
.qb-count{font-size:10px;background:rgba(201,168,76,.15);color:var(--gold2);border-radius:20px;padding:2px 8px;border:1px solid rgba(201,168,76,.2)}

/* ── QUEUE SCREEN ── */
.qscreen{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .4s cubic-bezier(.32,1,.25,1);overflow:hidden}
.qscreen.open{transform:translateX(0)}
.qscreen::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(201,168,76,.06),transparent 60%)}

.qscreen-head{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:52px 20px 16px;border-bottom:1px solid var(--b1);position:relative;z-index:1}
.qscreen-back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.07);border:none;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s;flex-shrink:0}
.qscreen-back:hover{color:var(--txt);background:rgba(255,255,255,.12)}
.qscreen-back svg{width:18px;height:18px}
.qscreen-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-style:italic;font-weight:300;color:var(--txt);flex:1}
.qscreen-count{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--t2);font-weight:600}

.q-add-section{padding:14px 16px 6px;border-bottom:1px solid var(--b1);flex-shrink:0;position:relative;z-index:1}
.q-add-label{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--t3);font-weight:700;margin-bottom:10px}
.q-add-list{display:flex;flex-direction:column;gap:3px}
.q-add-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s}
.q-add-row:hover{background:var(--hover);border-color:var(--b1)}
.q-add-art{width:34px;height:34px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--b1);position:relative;overflow:hidden}
.q-add-art::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);pointer-events:none}
.q-add-art svg{position:relative;z-index:1}
.q-add-info{flex:1;min-width:0}
.q-add-title{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.q-add-sub{font-size:10px;color:var(--t2);margin-top:1px}
.q-add-btn{width:26px;height:26px;border-radius:50%;border:none;background:rgba(201,168,76,.12);color:var(--gold2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,transform .12s}
.q-add-btn:hover{background:rgba(201,168,76,.25);transform:scale(1.1)}
.q-add-btn:active{transform:scale(.9)}
.q-add-btn svg{width:14px;height:14px}
.already-badge{font-size:9px;color:var(--gold);background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);border-radius:10px;padding:2px 7px;flex-shrink:0;white-space:nowrap}

.qscreen-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 16px 32px;scrollbar-width:thin;scrollbar-color:var(--b2) transparent;position:relative;z-index:1}
.qscreen-body::-webkit-scrollbar{width:3px}
.qscreen-body::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}

.qscreen-now{padding:12px 14px 6px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3);font-weight:700}
.qscreen-next{padding:12px 14px 4px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3);font-weight:700;display:flex;align-items:center;justify-content:space-between}
.qscreen-next span{font-size:9px;color:var(--t3);letter-spacing:.04em;text-transform:none;font-weight:400;font-style:italic}

.q-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s;margin-bottom:2px}
.q-row:hover{background:var(--hover);border-color:var(--b1)}
.q-row.q-now{background:linear-gradient(135deg,rgba(201,168,76,.08),rgba(100,70,200,.05));border-color:rgba(201,168,76,.2)}

.q-handle{display:flex;flex-direction:column;gap:3px;color:var(--t3);cursor:grab;padding:2px 4px;flex-shrink:0;opacity:0;transition:opacity .15s}
.q-row:hover .q-handle{opacity:1}
.q-handle:active{cursor:grabbing}
.q-handle span{display:block;width:14px;height:1.5px;background:currentColor;border-radius:1px}

.q-row.dragging{opacity:.35;transform:scale(.97)}
.q-row.drag-over-top{border-top:2px solid var(--gold2) !important}
.q-row.drag-over-bottom{border-bottom:2px solid var(--gold2) !important}

.q-art{width:42px;height:42px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--b1);position:relative;overflow:hidden}
.q-art::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);pointer-events:none}
.q-art svg{position:relative;z-index:1}
.q-info{flex:1;min-width:0}
.q-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.q-row.q-now .q-title{color:var(--gold2)}
.q-sub{font-size:10px;color:var(--t2);margin-top:2px}
.q-dur{font-size:10px;color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.q-remove{width:26px;height:26px;border-radius:50%;border:none;background:none;color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s,color .15s,background .15s;flex-shrink:0}
.q-row:hover .q-remove{opacity:1}
.q-remove:hover{color:var(--txt);background:rgba(255,255,255,.1)}
.q-remove svg{width:13px;height:13px}
.q-empty{text-align:center;padding:30px 20px;font-size:13px;color:var(--t3);font-style:italic}

@media(max-width:500px){
  .hdr{padding:40px 18px 18px}
  .plist{padding:0 6px 6px}
  .track{padding:10px;border-radius:13px;gap:10px}
  .t-art{width:46px;height:46px;border-radius:11px}
  .t-title{font-size:13px}
  .bar{padding:0 14px}
  .sh-body{padding:4px 20px 8px}
  .vin-wrap{width:min(48vw,30dvh,200px);margin-bottom:10px}
  .vin-glow{inset:-20px}
  .sh-song{margin-bottom:8px}
  .sh-title{font-size:1.45rem;margin-bottom:6px}
  .sh-lang{font-size:8px;padding:2px 7px}
  .sh-viz{height:24px;margin-bottom:8px}
  .sh-prog{margin-bottom:8px}
  .prow{height:20px;margin-bottom:5px}
  .pthumb{width:13px;height:13px}
  .sh-ctrl{margin-bottom:8px;gap:5px}
  .cplay{width:56px;height:56px}
  .cplay svg{width:24px;height:24px}
  .cskip{width:40px;height:40px}
  .cskip svg{width:19px;height:19px}
  .ctr{width:34px;height:34px}
  .ctr svg{width:17px;height:17px}
  .sh-vol{gap:8px}
  .queue-btn{margin-top:8px;padding:8px 12px;font-size:11px;border-radius:10px}
}
@media(min-width:700px){
  .hdr{padding:60px 48px 28px}
  .plist{padding:0 36px 8px}
  .bar{padding:0 36px}
  .sh-body{padding:8px 48px 24px}
  .vin-wrap{width:min(55vw,42dvh,300px);margin-bottom:24px}
  .sh-song{margin-bottom:18px}
  .sh-viz{height:38px;margin-bottom:16px}
  .sh-prog{margin-bottom:18px}
  .sh-ctrl{margin-bottom:18px}
}

<body>
<div class="app" id="app">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="page" id="page">
    <div class="hdr">
      <div class="hdr-eye">Personal Collection</div>
      <div class="hdr-name">Songs By Me</div>
      <div class="hdr-sub">6 covers · Sung with love</div>
    </div>
    <div class="plist" id="plist"></div>
  </div>

  <div class="bar ghost" id="bar">
    <div class="bar-prog" id="bprog" style="width:0%"></div>
    <div class="bar-disc" id="bdisc">
      <!-- CHANGE 1: hardcoded gold, never changes per-song -->
      <svg id="bdisc-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#c9a84c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    </div>
    <div class="bar-info">
      <div class="bar-title" id="btitle">—</div>
      <div class="bar-sub" id="bsub">Tap to open player</div>
    </div>
    <button class="bar-btn" id="bprev" onclick="event.stopPropagation()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 20L9 12l10-8v16z"/><rect x="5" y="4" width="2.5" height="16" rx="1"/></svg>
    </button>
    <button class="bar-playbtn" id="bplay" onclick="event.stopPropagation()">
      <svg id="bplay-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="bar-btn" id="bnext" onclick="event.stopPropagation()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4z"/><rect x="16.5" y="4" width="2.5" height="16" rx="1"/></svg>
    </button>
    <button class="bar-up" id="bup" onclick="event.stopPropagation()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
  </div>

  <!-- PLAYER SHEET -->
  <div class="sheet" id="sheet">
    <div class="sh-handle-area" id="sh-handle"><div class="sh-handle"></div></div>
    <button class="sh-close" id="sh-close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>

    <div class="sh-body">
      <div class="vin-wrap">
        <div class="vin-glow" id="vinglow"></div>
        <div class="vin-disc dim" id="vindisc">
          <div class="vin-lbl">
            <!-- CHANGE 2: gold instead of #06060e -->
            <svg viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
            </svg>
          </div>
        </div>
        <svg class="tonearm" id="tonearm" viewBox="0 0 100 100" fill="none">
          <circle cx="82" cy="10" r="9" fill="rgba(201,168,76,.1)" stroke="rgba(201,168,76,.5)" stroke-width="1.5"/>
          <circle cx="82" cy="10" r="3.5" fill="#c9a84c"/>
          <line x1="82" y1="18" x2="22" y2="80" stroke="rgba(201,168,76,.45)" stroke-width="2.2" stroke-linecap="round"/>
          <ellipse cx="22" cy="80" rx="6.5" ry="4" fill="rgba(201,168,76,.12)" stroke="rgba(201,168,76,.45)" stroke-width="1"/>
        </svg>
      </div>

      <div class="sh-song">
        <div class="sh-title" id="shtitle">Munbe Vaa</div>
        <span class="sh-lang" id="shlang">Tamil</span><span class="sh-type">Cover</span>
      </div>

      <div class="sh-viz"><canvas id="viz"></canvas></div>

      <div class="sh-prog">
        <div class="prow">
          <div class="ptrack"><div class="pfill" id="pfill"></div></div>
          <div class="pthumb" id="pthumb"></div>
          <input type="range" class="pinput" id="prog" value="0" min="0" max="100" step="0.1">
        </div>
        <div class="trow"><span id="cur">0:00</span><span id="dur">--:--</span></div>
      </div>

      <div class="sh-ctrl">
        <button class="ctr" id="btn-shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
        </button>
        <button class="ctr cskip" id="btn-prev">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 20L9 12l10-8v16z"/><rect x="5" y="4" width="2.5" height="16" rx="1"/></svg>
        </button>
        <button class="cplay" id="btn-play">
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctr cskip" id="btn-next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4z"/><rect x="16.5" y="4" width="2.5" height="16" rx="1"/></svg>
        </button>
        <button class="ctr" id="btn-repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <div class="sh-vol">
        <span class="vico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg></span>
        <div class="vwrap">
          <div class="vtrack"><div class="vfill" id="vfill"></div></div>
          <input type="range" class="vinput" id="vol" value="80" min="0" max="100">
        </div>
        <span class="vico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></span>
      </div>

      <button class="queue-btn" id="queue-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span class="qb-label">Up next</span>
        <span id="qb-count" class="qb-count">0</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>

  <!-- QUEUE SCREEN -->
  <div class="qscreen" id="qscreen">
    <div class="qscreen-head">
      <button class="qscreen-back" id="qscreen-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="qscreen-title">Queue</div>
      <div class="qscreen-count" id="qscreen-count">0 songs</div>
    </div>

    <div class="q-add-section" id="q-add-section">
      <div class="q-add-label">Add to queue</div>
      <div class="q-add-list" id="q-add-list"></div>
    </div>

    <div class="qscreen-body" id="qscreen-body"></div>
  </div>
</div>

<audio id="audio"></audio>

<script>
(function(){
const SONGS=[
  {src:"{{ url_for('static',filename='audio/song1.mp3') }}",title:"Munbe Vaa",              lang:"Tamil",    color:"#3d1f5e"},
  {src:"{{ url_for('static',filename='audio/song2.mp3') }}",title:"Ninakai Njan Paattu",    lang:"Malayalam",color:"#0e2d1e"},
  {src:"{{ url_for('static',filename='audio/song3.mp3') }}",title:"Mozhikalum Mounangalum",lang:"Malayalam",color:"#1a1533"},
  {src:"{{ url_for('static',filename='audio/song4.mp3') }}",title:"Oru Venal Puzhayil",    lang:"Malayalam",color:"#0d2333"},
  {src:"{{ url_for('static',filename='audio/song5.mp3') }}",title:"Kya Hua Tera Wada",     lang:"Hindi",    color:"#2e1b0e"},
  {src:"{{ url_for('static',filename='audio/song6.mp3') }}",title:"Parayathe Ariyathe",    lang:"Malayalam",color:"#1e2e18"},
];

/* CHANGE 3: noteIcon always uses gold — accent param removed from SONGS, ignored here */
function noteIcon(size){
  return`<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;
}

let queue=SONGS.map((_,i)=>i), origQ=SONGS.map((_,i)=>i);
let qpos=0,playing=false,shuffle=false,repeat=false,loaded=false;
const durs=Array(SONGS.length).fill(null);

const audio=document.getElementById('audio');
const bar=document.getElementById('bar'),bprog=document.getElementById('bprog');
const bdisc=document.getElementById('bdisc'),btitle=document.getElementById('btitle');
const bsub=document.getElementById('bsub'),bplayIcon=document.getElementById('bplay-icon');
const sheet=document.getElementById('sheet'),vindisc=document.getElementById('vindisc');
const vinglow=document.getElementById('vinglow'),tonearm=document.getElementById('tonearm');
const shtitle=document.getElementById('shtitle'),shlang=document.getElementById('shlang');
const pfill=document.getElementById('pfill'),pthumb=document.getElementById('pthumb');
const prog=document.getElementById('prog'),curEl=document.getElementById('cur'),durEl=document.getElementById('dur');
const playIcon=document.getElementById('play-icon'),vfill=document.getElementById('vfill');
const queueBtn=document.getElementById('queue-btn');
const qbCount=document.getElementById('qb-count');
const qscreen=document.getElementById('qscreen');
const qscreenBody=document.getElementById('qscreen-body');
const qscreenCount=document.getElementById('qscreen-count');
const qAddList=document.getElementById('q-add-list');

/* ── VISUALIZER ── */
const cvs=document.getElementById('viz'),c2=cvs.getContext('2d'),N=52;
const hh=new Float32Array(N).fill(.04);
const tt=new Float32Array(N).map(()=>Math.random()*.3+.05);
const ss=new Float32Array(N).map(()=>.02+Math.random()*.05);
let vizOn=false,cachedGrad=null,cachedGradH=0;

function szC(){const r=cvs.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;cvs.width=Math.round(r.width*d);cvs.height=Math.round(r.height*d);cachedGrad=null}
szC();new ResizeObserver(szC).observe(cvs.parentElement);

(function draw(){
  const W=cvs.width,H=cvs.height;c2.clearRect(0,0,W,H);
  if(!cachedGrad||cachedGradH!==H){cachedGrad=c2.createLinearGradient(0,0,0,H);cachedGrad.addColorStop(0,'rgba(245,224,160,.92)');cachedGrad.addColorStop(.45,'rgba(201,168,76,.6)');cachedGrad.addColorStop(1,'rgba(60,40,10,.08)');cachedGradH=H}
  c2.fillStyle=cachedGrad;
  const slot=W/N,gap=Math.max(1,slot*.3),bw=slot-gap;
  for(let i=0;i<N;i++){
    if(vizOn){hh[i]+=(tt[i]-hh[i])*ss[i];if(Math.abs(hh[i]-tt[i])<.006){tt[i]=Math.random()*.88+.06;ss[i]=.018+Math.random()*.052}}
    else{hh[i]+=(0.03-hh[i])*.07}
    const bh=Math.max(2,hh[i]*H),x=i*slot+gap/2,y=H-bh;
    c2.beginPath();c2.roundRect(x,y,bw,bh,2);c2.fill();
  }
  requestAnimationFrame(draw);
})();

const PL='M8 5v14l11-7z',PA='M6 19h4V5H6v14zm8-14v14h4V5h-4z';
function fmt(s){if(!s||isNaN(s))return'--:--';return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`}

function setPlaying(on){
  playing=on;vizOn=on;
  vindisc.classList.toggle('spin',on);
  vindisc.classList.toggle('dim',!on);
  vinglow.classList.toggle('on',on);
  tonearm.classList.toggle('on',on);
  bdisc.classList.toggle('spin',on);
  const d=on?PA:PL;
  playIcon.querySelector('path').setAttribute('d',d);
  bplayIcon.querySelector('path').setAttribute('d',d);
}

function setProgress(p){pfill.style.width=p+'%';pthumb.style.left=p+'%';bprog.style.width=p+'%';prog.value=p}

function loadSong(idx){
  const s=SONGS[queue[idx]];
  audio.src=s.src;audio.load();
  shtitle.classList.remove('anim');void shtitle.offsetWidth;shtitle.textContent=s.title;shtitle.classList.add('anim');
  shlang.textContent=s.lang;
  btitle.textContent=s.title;bsub.textContent=s.lang+' · Cover';
  /* CHANGE 4: removed bdiscIcon.setAttribute('stroke', s.accent) — icon stays gold always */
  setProgress(0);curEl.textContent='0:00';durEl.textContent='--:--';
}

function playIdx(idx){
  qpos=idx;loaded=true;loadSong(qpos);
  audio.play().then(()=>setPlaying(true)).catch(()=>{});
  bar.classList.remove('ghost');
  renderList();renderQueue();
}

function togglePlay(){
  if(!loaded){playIdx(0);return}
  if(playing){audio.pause();setPlaying(false)}
  else{audio.play().then(()=>setPlaying(true)).catch(()=>{})}
}
function next(){qpos=(qpos+1)%queue.length;playIdx(qpos)}
function prev(){if(audio.currentTime>3){audio.currentTime=0;return}qpos=(qpos-1+queue.length)%queue.length;playIdx(qpos)}

function openSheet(){sheet.classList.add('open')}
function closeSheet(){sheet.classList.remove('open');sheet.style.transform=''}
function openQueue(){renderQueue();qscreen.classList.add('open')}
function closeQueue(){qscreen.classList.remove('open')}

bar.addEventListener('click',openSheet);
document.getElementById('bup').addEventListener('click',e=>{e.stopPropagation();openSheet()});
document.getElementById('sh-close').addEventListener('click',closeSheet);
document.getElementById('sh-handle').addEventListener('click',closeSheet);
queueBtn.addEventListener('click',openQueue);
document.getElementById('qscreen-back').addEventListener('click',closeQueue);

/* swipe-to-close sheet */
let ty0=0,ty=0,swipeActive=false;
const shHandle=document.getElementById('sh-handle');
shHandle.addEventListener('touchstart',e=>{swipeActive=true;ty0=e.touches[0].clientY;ty=0},{passive:true});
document.addEventListener('touchmove',e=>{if(!swipeActive)return;ty=e.touches[0].clientY-ty0;if(ty>0)sheet.style.transform=`translateY(${Math.min(ty,300)}px)`},{passive:true});
document.addEventListener('touchend',()=>{if(!swipeActive)return;swipeActive=false;if(ty>100)closeSheet();else{sheet.style.transform='';ty=0}},{passive:true});
sheet.addEventListener('transitionend',()=>{if(!sheet.classList.contains('open'))sheet.style.transform=''});

/* ── RENDER ADD-SONGS SECTION ── */
function renderAddSection(){
  const upcomingArr=queue.slice(qpos+1);
  const countInQueue=idx=>upcomingArr.filter(x=>x===idx).length;
  const nowSongIdx=queue[qpos];
  qAddList.innerHTML='';
  SONGS.forEach((s,i)=>{
    if(i===nowSongIdx)return;
    const count=countInQueue(i);
    const row=document.createElement('div');
    row.className='q-add-row';
    row.innerHTML=`
      <div class="q-add-art" style="background:${s.color}">${noteIcon(16)}</div>
      <div class="q-add-info">
        <div class="q-add-title">${s.title}</div>
        <div class="q-add-sub">${s.lang} · Cover${count>0?' · <span style=\"color:var(--gold);font-size:10px\">'+count+'× queued</span>':''}</div>
      </div>
      <button class="q-add-btn" data-idx="${i}" title="Add to queue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>`;
    row.querySelector('.q-add-btn').addEventListener('click',e=>{
      e.stopPropagation();
      queue.push(parseInt(e.currentTarget.dataset.idx));
      renderQueue();
      renderList();
    });
    qAddList.appendChild(row);
  });
}

/* ── RENDER QUEUE (reorderable) ── */
let dragSrcQpos=null;

function renderQueue(){
  const upcoming=queue.slice(qpos+1);
  const nowSong=SONGS[queue[qpos]];
  const count=upcoming.length;

  qbCount.textContent=count;
  qscreenCount.textContent=count+' song'+(count!==1?'s':'')+' up next';

  renderAddSection();

  let html='';
  if(loaded){
    html+=`<div class="qscreen-now">Now playing</div>
    <div class="q-row q-now">
      <div class="q-art" style="background:${nowSong.color}">${noteIcon(18)}</div>
      <div class="q-info"><div class="q-title">${nowSong.title}</div><div class="q-sub">${nowSong.lang} · Cover</div></div>
      <span class="q-dur">${fmt(durs[queue[qpos]])}</span>
    </div>`;
  }

  if(count===0){
    html+=`<div class="q-empty">Nothing queued — add songs above</div>`;
  } else {
    html+=`<div class="qscreen-next">Up next <span>drag to reorder</span></div>`;
    upcoming.forEach((songIdx,i)=>{
      const absQpos=qpos+1+i;
      const s=SONGS[songIdx];
      html+=`<div class="q-row" data-absqpos="${absQpos}" draggable="true">
        <div class="q-handle"><span></span><span></span><span></span></div>
        <div class="q-art" style="background:${s.color}">${noteIcon(18)}</div>
        <div class="q-info"><div class="q-title">${s.title}</div><div class="q-sub">${s.lang} · Cover</div></div>
        <span class="q-dur">${fmt(durs[songIdx])}</span>
        <button class="q-remove" data-absqpos="${absQpos}" title="Remove">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>`;
    });
  }

  qscreenBody.innerHTML=html;

  qscreenBody.querySelectorAll('.q-row:not(.q-now)').forEach(row=>{
    row.addEventListener('click',e=>{
      if(e.target.closest('.q-remove')||e.target.closest('.q-handle'))return;
      closeQueue();
      playIdx(parseInt(row.dataset.absqpos));
    });
  });

  qscreenBody.querySelectorAll('.q-remove').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const ap=parseInt(btn.dataset.absqpos);
      queue.splice(ap,1);
      renderQueue();renderList();
    });
  });

  const rows=[...qscreenBody.querySelectorAll('.q-row:not(.q-now)')];

  rows.forEach(row=>{
    row.addEventListener('dragstart',e=>{
      dragSrcQpos=parseInt(row.dataset.absqpos);
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',dragSrcQpos);
    });
    row.addEventListener('dragend',()=>{
      row.classList.remove('dragging');
      rows.forEach(r=>r.classList.remove('drag-over-top','drag-over-bottom'));
    });
    row.addEventListener('dragover',e=>{
      e.preventDefault();e.dataTransfer.dropEffect='move';
      const rect=row.getBoundingClientRect();
      const midY=rect.top+rect.height/2;
      rows.forEach(r=>r.classList.remove('drag-over-top','drag-over-bottom'));
      row.classList.add(e.clientY<midY?'drag-over-top':'drag-over-bottom');
    });
    row.addEventListener('dragleave',()=>{
      row.classList.remove('drag-over-top','drag-over-bottom');
    });
    row.addEventListener('drop',e=>{
      e.preventDefault();
      const from=dragSrcQpos;
      const toAbs=parseInt(row.dataset.absqpos);
      const rect=row.getBoundingClientRect();
      const midY=rect.top+rect.height/2;
      const insertBefore=e.clientY<midY;
      if(from===toAbs)return;
      const item=queue.splice(from,1)[0];
      let dest=toAbs;
      if(from<toAbs)dest--;
      if(!insertBefore)dest++;
      dest=Math.max(qpos+1,Math.min(dest,queue.length));
      queue.splice(dest,0,item);
      renderQueue();renderList();
    });
  });

  let touchDragSrc=null,touchClone=null,touchStartY=0;

  rows.forEach(row=>{
    const handle=row.querySelector('.q-handle');
    if(!handle)return;

    handle.addEventListener('touchstart',e=>{
      touchDragSrc=row;
      touchStartY=e.touches[0].clientY;
      row.classList.add('dragging');
      touchClone=row.cloneNode(true);
      touchClone.style.cssText=`position:fixed;left:${row.getBoundingClientRect().left}px;top:${row.getBoundingClientRect().top}px;width:${row.offsetWidth}px;opacity:.85;z-index:999;pointer-events:none;transform:scale(1.02);box-shadow:0 12px 40px rgba(0,0,0,.6);border-radius:14px;background:var(--surf);`;
      document.body.appendChild(touchClone);
    },{passive:true});

    handle.addEventListener('touchmove',e=>{
      if(!touchDragSrc||!touchClone)return;
      const dy=e.touches[0].clientY-touchStartY;
      touchClone.style.transform=`translateY(${dy}px) scale(1.02)`;
      const touchY=e.touches[0].clientY;
      rows.forEach(r=>{
        r.classList.remove('drag-over-top','drag-over-bottom');
        if(r===touchDragSrc)return;
        const rect=r.getBoundingClientRect();
        if(touchY>=rect.top&&touchY<=rect.bottom){
          r.classList.add(touchY<rect.top+rect.height/2?'drag-over-top':'drag-over-bottom');
        }
      });
    },{passive:true});

    handle.addEventListener('touchend',e=>{
      if(!touchDragSrc)return;
      if(touchClone){touchClone.remove();touchClone=null}
      touchDragSrc.classList.remove('dragging');
      rows.forEach(r=>r.classList.remove('drag-over-top','drag-over-bottom'));
      const touchY=e.changedTouches[0].clientY;
      const target=rows.find(r=>{
        if(r===touchDragSrc)return false;
        const rect=r.getBoundingClientRect();
        return touchY>=rect.top&&touchY<=rect.bottom;
      });
      if(target){
        const from=parseInt(touchDragSrc.dataset.absqpos);
        const toAbs=parseInt(target.dataset.absqpos);
        const rect=target.getBoundingClientRect();
        const insertBefore=touchY<rect.top+rect.height/2;
        if(from!==toAbs){
          const item=queue.splice(from,1)[0];
          let dest=toAbs;
          if(from<toAbs)dest--;
          if(!insertBefore)dest++;
          dest=Math.max(qpos+1,Math.min(dest,queue.length));
          queue.splice(dest,0,item);
          renderQueue();renderList();
        }
      }
      touchDragSrc=null;
    },{passive:true});
  });
}

/* ── RENDER SONG LIST ── */
function renderList(){
  const plist=document.getElementById('plist');
  plist.innerHTML='';
  const cur=queue[qpos];
  SONGS.forEach((s,songIdx)=>{
    const isNow=loaded&&songIdx===cur;
    const inQueue=queue.slice(qpos+1).includes(songIdx);
    const row=document.createElement('div');
    row.className='track'+(isNow?' now':'');
    row.innerHTML=`
      <div class="t-idx">
        <span class="t-num">${songIdx+1}</span>
        <div class="eq">
          <div class="eqb" style="--d:.42s;--s:.93"></div>
          <div class="eqb" style="--d:.61s;--s:.64"></div>
          <div class="eqb" style="--d:.38s;--s:1"></div>
        </div>
      </div>
      <div class="t-art" style="background:${s.color}">${noteIcon(22)}</div>
      <div class="t-info">
        <div class="t-title">${s.title}</div>
        <div class="t-sub">${s.lang} · Cover${inQueue&&!isNow?' · <span style="color:var(--gold);font-size:10px">In queue</span>':''}</div>
      </div>
      <span class="t-dur">${fmt(durs[songIdx])}</span>
      <button class="t-add" data-idx="${songIdx}" title="Add to queue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>`;

    row.addEventListener('click',e=>{
      if(e.target.closest('.t-add'))return;
      if(isNow){if(loaded)openSheet();else playIdx(0);return}
      const qi=queue.indexOf(songIdx,qpos+1);
      if(qi!==-1)playIdx(qi);
      else{queue.splice(qpos+1,0,songIdx);playIdx(qpos+1)}
    });

    const addBtn=row.querySelector('.t-add');
    if(addBtn){
      addBtn.addEventListener('click',e=>{
        e.stopPropagation();
        queue.push(parseInt(addBtn.dataset.idx));
        renderList();renderQueue();
      });
    }
    plist.appendChild(row);
  });
}

document.getElementById('btn-play').onclick=togglePlay;
document.getElementById('bplay').onclick=togglePlay;
document.getElementById('btn-prev').onclick=prev;
document.getElementById('btn-next').onclick=next;
document.getElementById('bprev').onclick=prev;
document.getElementById('bnext').onclick=next;

document.getElementById('btn-shuffle').onclick=()=>{
  shuffle=!shuffle;
  document.getElementById('btn-shuffle').classList.toggle('on',shuffle);
  if(shuffle){const c=queue[qpos],r=queue.filter((_,i)=>i!==qpos);for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}queue=[c,...r];qpos=0}
  else{const c=queue[qpos];queue=[...origQ];qpos=queue.indexOf(c)}
  renderList();renderQueue();
};
document.getElementById('btn-repeat').onclick=()=>{repeat=!repeat;document.getElementById('btn-repeat').classList.toggle('on',repeat)};

audio.addEventListener('ended',()=>repeat?(audio.currentTime=0,audio.play()):next());
audio.addEventListener('timeupdate',()=>{if(!audio.duration)return;const p=(audio.currentTime/audio.duration)*100;setProgress(p);curEl.textContent=fmt(audio.currentTime);durEl.textContent=fmt(audio.duration)});
prog.addEventListener('input',()=>{setProgress(+prog.value);if(audio.duration)audio.currentTime=(prog.value/100)*audio.duration});
document.getElementById('vol').addEventListener('input',function(){audio.volume=this.value/100;vfill.style.width=this.value+'%'});
audio.volume=0.8;

let pending=false;
SONGS.forEach((s,i)=>{
  const t=new Audio(s.src);
  t.addEventListener('loadedmetadata',()=>{durs[i]=t.duration;if(pending)return;pending=true;requestAnimationFrame(()=>{renderList();renderQueue();pending=false})});
});

renderList();renderQueue();
})();
</script>
