<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Songs By Me</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:      #07070f;
      --panel:   #0c0c17;
      --card:    rgba(255,255,255,0.035);
      --hover:   rgba(255,255,255,0.055);
      --b1:      rgba(255,255,255,0.07);
      --b2:      rgba(255,255,255,0.12);
      --gold:    #c9a84c;
      --gold2:   #e8cc7a;
      --gold3:   #f5e0a0;
      --text:    #f0ece3;
      --t2:      #6e6a62;
      --t3:      #38342e;
    }

    html, body {
      height: 100%; height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body::after {
      content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E");
      background-size: 180px; opacity: 0.02;
    }

    /* 420px left, rest right */
    .app {
      display: grid;
      grid-template-columns: 420px 1fr;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── LEFT ── */
    .left {
      background: var(--panel);
      border-right: 1px solid var(--b1);
      display: flex; flex-direction: column;
      overflow: hidden; position: relative;
    }
    .left::before {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse 120% 50% at 50% -5%, rgba(201,168,76,0.08), transparent 60%);
    }
    .lscroll {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 40px 36px 28px;
      position: relative; z-index: 1;
      scrollbar-width: none; display: flex; flex-direction: column;
    }
    .lscroll::-webkit-scrollbar { display: none; }

    .brand { margin-bottom: 32px; }
    .brand-eye { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 5px; }
    .brand-name { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-style: italic; font-weight: 300; line-height: 1; color: var(--text); }
    .brand-sub { font-size: 11px; color: var(--t2); margin-top: 6px; letter-spacing: .04em; }

    .art-wrap { position: relative; margin-bottom: 30px; }
    .art-glow {
      position: absolute; inset: -20px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(201,168,76,0.2) 0%, transparent 70%);
      opacity: 0; transition: opacity 1s ease;
    }
    .art-glow.on { opacity: 1; animation: glow-breathe 3.5s ease-in-out infinite; }
    @keyframes glow-breathe { 0%,100%{transform:scale(.9);opacity:.5} 50%{transform:scale(1.05);opacity:1} }

    .artwork {
      width: 100%; aspect-ratio: 1; border-radius: 24px;
      background: #0a0a15; border: 1px solid var(--b2);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      box-shadow: 0 40px 100px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.025);
    }
    .artwork::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(135deg, rgba(232,204,122,.07) 0%, transparent 45%);
    }

    .arm {
      position: absolute; top: 14px; right: 18px;
      width: 90px; height: 90px;
      transform-origin: 82% 10%;
      transform: rotate(-28deg);
      transition: transform 1.2s cubic-bezier(.25,.46,.45,.94);
      pointer-events: none; z-index: 10;
    }
    .arm.on { transform: rotate(-5deg); }

    .vinyl {
      width: 75%; aspect-ratio: 1; border-radius: 50%;
      position: relative; will-change: transform;
      background:
        radial-gradient(circle, #1e1e28 0%, #1e1e28 16%, transparent 16.5%),
        repeating-conic-gradient(from 0deg, #0f0f18 0deg 2deg, #161620 2deg 4deg);
      box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 0 0 2px rgba(0,0,0,.7), inset 0 0 50px rgba(0,0,0,.5), 0 12px 40px rgba(0,0,0,.7);
      transition: filter .7s ease;
    }
    .vinyl.playing { animation: spin 7s linear infinite; }
    .vinyl.dim { filter: brightness(.45) saturate(.6); }
    @keyframes spin { to { transform: rotate(360deg); } }

    .vinyl-label {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 28%; aspect-ratio: 1; border-radius: 50%;
      background: conic-gradient(from 135deg, #3a2506, var(--gold), var(--gold2), var(--gold3), var(--gold), #3a2506);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem; z-index: 2;
      box-shadow: 0 2px 18px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.1);
    }
    .vinyl::before {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(ellipse 55% 35% at 28% 18%, rgba(255,255,255,.07), transparent 55%);
      z-index: 1; pointer-events: none;
    }

    .track-info { margin-bottom: 16px; }
    .track-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem; font-style: italic; font-weight: 400;
      line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    @keyframes title-in { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    .track-title.anim { animation: title-in .35s ease forwards; }
    .track-tags { display: flex; align-items: center; gap: 9px; }
    .tag-lang { font-size: 9px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); border: 1px solid rgba(201,168,76,.32); padding: 2px 9px; border-radius: 3px; }
    .tag-type { font-size: 11px; color: var(--t2); }

    .viz-wrap { width: 100%; height: 42px; margin-bottom: 22px; border-radius: 7px; overflow: hidden; background: rgba(255,255,255,.013); }
    #viz { width: 100%; height: 100%; display: block; }

    .prog-area { margin-bottom: 26px; }
    .prog-row { position: relative; height: 24px; display: flex; align-items: center; cursor: pointer; margin-bottom: 6px; }
    .prog-track { position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px; background: rgba(255,255,255,.07); pointer-events: none; }
    .prog-fill { height: 100%; width: 0%; border-radius: 2px; background: linear-gradient(to right, #5a3e10, var(--gold2)); pointer-events: none; }
    .prog-thumb {
      position: absolute; left: 0%; width: 14px; height: 14px; border-radius: 50%;
      background: var(--gold2); transform: translateX(-50%);
      box-shadow: 0 0 0 3px rgba(232,204,122,.22), 0 0 16px rgba(232,204,122,.45);
      pointer-events: none; z-index: 2; transition: transform .12s;
    }
    .prog-row:hover .prog-thumb { transform: translateX(-50%) scale(1.3); }
    .prog-input { position: absolute; left: 0; right: 0; width: 100%; height: 24px; opacity: 0; cursor: pointer; z-index: 3; -webkit-appearance: none; appearance: none; }
    .time-row { display: flex; justify-content: space-between; font-size: 10px; color: var(--t2); font-variant-numeric: tabular-nums; letter-spacing: .04em; }

    .controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; }
    .ctrl { background: none; border: none; color: var(--t2); cursor: pointer; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: color .2s, background .2s, transform .12s; }
    .ctrl:hover { color: var(--text); background: rgba(255,255,255,.05); }
    .ctrl:active { transform: scale(.82); }
    .ctrl.active { color: var(--gold2); }
    .ctrl svg { width: 19px; height: 19px; }
    .skip { background: rgba(255,255,255,.05); border: 1px solid var(--b1); width: 46px; height: 46px; border-radius: 50%; color: var(--text); transition: background .2s, transform .12s, box-shadow .2s; }
    .skip:hover { background: rgba(255,255,255,.09); box-shadow: 0 4px 18px rgba(0,0,0,.35); }
    .skip svg { width: 21px; height: 21px; }
    .playpause {
      width: 68px; height: 68px; border-radius: 50%; border: none; cursor: pointer;
      background: conic-gradient(from 135deg, #c9a84c, #e8cc7a, #f5e0a0, #e8cc7a, #c9a84c);
      color: #06060e; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 1px rgba(232,204,122,.25), 0 8px 36px rgba(201,168,76,.55);
      transition: transform .15s, box-shadow .2s; flex-shrink: 0; position: relative; overflow: hidden;
    }
    .playpause::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(ellipse 60% 45% at 35% 25%, rgba(255,255,255,.28), transparent 58%); pointer-events: none; }
    .playpause:active { transform: scale(.88); box-shadow: 0 4px 18px rgba(201,168,76,.3); }
    .playpause svg { width: 28px; height: 28px; position: relative; z-index: 1; margin-left: 2px; }

    .vol-row { display: flex; align-items: center; gap: 11px; }
    .vol-icon { color: var(--t3); display: flex; }
    .vol-icon svg { width: 14px; height: 14px; }
    .vol-wrap { flex: 1; position: relative; height: 20px; display: flex; align-items: center; }
    .vol-track { position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px; background: rgba(255,255,255,.07); overflow: hidden; pointer-events: none; }
    .vol-fill { height: 100%; width: 80%; background: linear-gradient(to right, #5a3e10, var(--gold)); }
    .vol-input { position: absolute; left: 0; right: 0; width: 100%; height: 20px; opacity: 0; cursor: pointer; z-index: 3; -webkit-appearance: none; appearance: none; }

    /* ── RIGHT ── */
    .right { background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }

    .rhead { padding: 36px 40px 24px; border-bottom: 1px solid var(--b1); flex-shrink: 0; }
    .rhead-top { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
    .rhead-eyebrow { font-size: 9px; letter-spacing: .28em; text-transform: uppercase; color: var(--t3); font-weight: 600; margin-bottom: 4px; }
    .rhead-title { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-style: italic; font-weight: 300; color: var(--text); }
    .rhead-count { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--t2); font-weight: 600; }
    .tabs { display: inline-flex; border: 1px solid var(--b1); border-radius: 8px; overflow: hidden; }
    .tab { padding: 6px 18px; background: none; border: none; font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t2); cursor: pointer; transition: background .2s, color .2s; }
    .tab + .tab { border-left: 1px solid var(--b1); }
    .tab.on { background: rgba(201,168,76,.1); color: var(--gold2); }

    .panel { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
    .panel.on { display: flex; }
    .panel::-webkit-scrollbar { width: 3px; }
    .panel::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 3px; }

    /* track list — grid layout, bigger rows */
    .tlist { padding: 12px 28px 20px; }

    .titem {
      display: grid;
      grid-template-columns: 32px 56px 1fr auto;
      align-items: center; gap: 0 16px;
      padding: 14px 16px; border-radius: 14px; cursor: pointer;
      border: 1px solid transparent;
      transition: background .18s, border-color .18s, transform .15s;
      position: relative;
    }
    .titem:not(:last-child)::after { content: ''; position: absolute; bottom: 0; left: 16px; right: 16px; height: 1px; background: var(--b1); }
    .titem:hover { background: var(--hover); transform: translateX(4px); }
    .titem:hover::after { display: none; }
    .titem.now { background: rgba(201,168,76,.055); border-color: rgba(201,168,76,.2); transform: translateX(4px); }
    .titem.now::after { display: none; }

    .tnum-cell { text-align: center; }
    .tnum { font-size: 11px; color: var(--t3); font-variant-numeric: tabular-nums; }
    .titem.now .tnum { display: none; }
    .now-bars { display: none; align-items: flex-end; justify-content: center; gap: 2px; height: 14px; }
    .titem.now .now-bars { display: flex; }
    .nb { width: 3px; border-radius: 1.5px; background: var(--gold2); animation: nb var(--nd) ease-in-out infinite alternate; }
    @keyframes nb { from{height:3px} to{height:var(--nh)} }

    .tthumb { width: 56px; height: 56px; border-radius: 12px; background: linear-gradient(135deg, #14141e, #0e0e18); border: 1px solid var(--b1); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; transition: border-color .2s, box-shadow .2s, transform .2s; }
    .titem:hover .tthumb { transform: scale(1.06); }
    .titem.now .tthumb { border-color: rgba(201,168,76,.35); box-shadow: 0 0 20px rgba(201,168,76,.15); }

    .ttext { min-width: 0; }
    .ttitle { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); margin-bottom: 4px; transition: color .2s; }
    .titem.now .ttitle { color: var(--gold2); }
    .tsub { font-size: 11px; color: var(--t2); }

    .tdur { font-size: 11px; color: var(--t3); font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* queue */
    .qwrap { padding: 12px 28px 20px; display: flex; flex-direction: column; gap: 5px; }
    .qitem { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--b1); cursor: grab; transition: opacity .15s, transform .15s, border-color .18s; }
    .qitem:active { cursor: grabbing; }
    .qitem.dragging { opacity: .3; transform: scale(.95); }
    .qitem.dragover { border-color: rgba(201,168,76,.45); background: rgba(201,168,76,.06); }
    .qhandle { display: flex; flex-direction: column; gap: 3.5px; color: var(--t3); cursor: grab; padding: 2px; flex-shrink: 0; }
    .qhandle span { display: block; width: 14px; height: 1.5px; background: currentColor; border-radius: 1px; }
    .qpos { width: 22px; text-align: center; font-size: 11px; color: var(--t2); flex-shrink: 0; }
    .qinfo { flex: 1; min-width: 0; }
    .qtitle { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qsub { font-size: 11px; color: var(--t2); margin-top: 2px; }
    .qdur { font-size: 11px; color: var(--t3); flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .qnow { font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--gold2); flex-shrink: 0; }

    .back { display: flex; align-items: center; gap: 8px; padding: 20px 40px; color: var(--t3); font-size: 10px; text-decoration: none; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; transition: color .2s; flex-shrink: 0; }
    .back:hover { color: var(--gold2); }
    .back svg { width: 12px; height: 12px; }

    /* mini bar */
    .mini { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 72px; background: rgba(7,7,15,.97); backdrop-filter: blur(30px); border-top: 1px solid var(--b2); align-items: center; padding: 0 16px; gap: 12px; z-index: 500; }
    .mini-disc { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; background: repeating-conic-gradient(#0f0f18 0deg 4deg, #17171f 4deg 8deg); border: 2px solid rgba(201,168,76,.3); display: flex; align-items: center; justify-content: center; font-size: .95rem; will-change: transform; }
    .mini-disc.playing { animation: spin 7s linear infinite; }
    .mini-info { flex: 1; min-width: 0; }
    .mini-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-sub { font-size: 10px; color: var(--t2); margin-top: 2px; }
    .mini-btns { display: flex; align-items: center; gap: 4px; }
    .mini-btn { background: none; border: none; color: var(--t2); cursor: pointer; padding: 6px; display: flex; align-items: center; }
    .mini-btn svg { width: 22px; height: 22px; }
    .mini-play { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--gold2), var(--gold)); border: none; color: #06060e; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .mini-play svg { width: 17px; height: 17px; margin-left: 1px; }
    .mini-prog { position: absolute; bottom: 0; left: 0; height: 2px; background: linear-gradient(to right, #5a3e10, var(--gold2)); border-radius: 0 1px 1px 0; }

    @media (max-width: 720px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow: hidden; }
      .left { width: 100%; border-right: none; border-bottom: 1px solid var(--b1); max-height: 52dvh; }
      .lscroll { padding: 18px 20px 14px; }
      .brand { margin-bottom: 14px; }
      .brand-name { font-size: 1.6rem; }
      .track-title { font-size: 1.5rem; }
      .viz-wrap { height: 28px; margin-bottom: 14px; }
      .controls { margin-bottom: 14px; gap: 8px; }
      .playpause { width: 58px; height: 58px; }
      .playpause svg { width: 24px; height: 24px; }
      .skip { width: 42px; height: 42px; }
      .vol-row { display: none; }
      .right { padding-bottom: 72px; }
      .rhead { padding: 16px 18px 14px; }
      .rhead-title { font-size: 1.5rem; }
      .tlist { padding: 8px 12px 16px; }
      .titem { grid-template-columns: 28px 46px 1fr auto; }
      .tthumb { width: 46px; height: 46px; }
      .qwrap { padding: 8px 12px 16px; }
      .back { padding: 16px 20px; }
      .mini { display: flex; }
    }
  </style>
</head>
<body>
<div class="app">

  <div class="left">
    <div class="lscroll">
      <div class="brand">
        <div class="brand-eye">Personal Collection</div>
        <div class="brand-name">Songs By Me</div>
        <div class="brand-sub">6 covers &middot; Sung with love</div>
      </div>

      <div class="art-wrap">
        <div class="art-glow" id="art-glow"></div>
        <div class="artwork">
          <div class="arm" id="arm">
            <svg width="90" height="90" viewBox="0 0 90 90" fill="none">
              <circle cx="74" cy="10" r="8" fill="rgba(201,168,76,.1)" stroke="rgba(201,168,76,.5)" stroke-width="1.5"/>
              <circle cx="74" cy="10" r="3.5" fill="#c9a84c"/>
              <line x1="74" y1="18" x2="20" y2="74" stroke="rgba(201,168,76,.5)" stroke-width="2" stroke-linecap="round"/>
              <ellipse cx="20" cy="74" rx="6" ry="4" fill="rgba(201,168,76,.15)" stroke="rgba(201,168,76,.5)" stroke-width="1"/>
            </svg>
          </div>
          <div class="vinyl dim" id="vinyl">
            <div class="vinyl-label">🎵</div>
          </div>
        </div>
      </div>

      <div class="track-info">
        <div class="track-title" id="np-title">Munbe Vaa</div>
        <div class="track-tags">
          <span class="tag-lang" id="np-lang">Tamil</span>
          <span class="tag-type">Cover</span>
        </div>
      </div>

      <div class="viz-wrap"><canvas id="viz"></canvas></div>

      <div class="prog-area">
        <div class="prog-row">
          <div class="prog-track"><div class="prog-fill" id="pfill"></div></div>
          <div class="prog-thumb" id="pthumb"></div>
          <input type="range" class="prog-input" id="prog" value="0" min="0" max="100" step="0.1">
        </div>
        <div class="time-row"><span id="cur">0:00</span><span id="dur">--:--</span></div>
      </div>

      <div class="controls">
        <button class="ctrl" id="btn-shuffle" title="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
        </button>
        <button class="ctrl skip" id="btn-prev">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 20L9 12l10-8v16z"/><rect x="5" y="4" width="2.5" height="16" rx="1"/></svg>
        </button>
        <button class="playpause" id="btn-play">
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl skip" id="btn-next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4z"/><rect x="16.5" y="4" width="2.5" height="16" rx="1"/></svg>
        </button>
        <button class="ctrl" id="btn-repeat" title="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <div class="vol-row">
        <span class="vol-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg></span>
        <div class="vol-wrap">
          <div class="vol-track"><div class="vol-fill" id="vfill"></div></div>
          <input type="range" class="vol-input" id="vol" value="80" min="0" max="100">
        </div>
        <span class="vol-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></span>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="rhead">
      <div class="rhead-top">
        <div>
          <div class="rhead-eyebrow">Your Recordings</div>
          <div class="rhead-title">The Collection</div>
        </div>
        <div class="rhead-count">6 tracks</div>
      </div>
      <div class="tabs">
        <button class="tab on" data-panel="playlist">Playlist</button>
        <button class="tab" data-panel="queue">Queue</button>
      </div>
    </div>

    <div class="panel on" id="panel-playlist">
      <div class="tlist" id="tlist"></div>
      <a href="/memory" class="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Home
      </a>
    </div>
    <div class="panel" id="panel-queue">
      <div class="qwrap" id="qlist"></div>
    </div>
  </div>

</div>

<div class="mini" id="mini">
  <div class="mini-disc" id="mini-disc">🎵</div>
  <div class="mini-info">
    <div class="mini-title" id="mini-title">Munbe Vaa</div>
    <div class="mini-sub" id="mini-sub">Tamil · Cover</div>
  </div>
  <div class="mini-btns">
    <button class="mini-btn" id="mini-prev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 20L9 12l10-8v16z"/><rect x="5" y="4" width="2.5" height="16" rx="1"/></svg></button>
    <button class="mini-play" id="mini-play"><svg id="mini-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="mini-btn" id="mini-next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4z"/><rect x="16.5" y="4" width="2.5" height="16" rx="1"/></svg></button>
  </div>
  <div class="mini-prog" id="mini-prog" style="width:0%"></div>
</div>

<audio id="audio"></audio>

<script>
(function(){
  const SONGS = [
    { src:"{{ url_for('static',filename='audio/song1.mp3') }}", title:"Munbe Vaa",              lang:"Tamil"     },
    { src:"{{ url_for('static',filename='audio/song2.mp3') }}", title:"Ninakai Njan Paattu",    lang:"Malayalam" },
    { src:"{{ url_for('static',filename='audio/song3.mp3') }}", title:"Mozhikalum Mounangalum", lang:"Malayalam" },
    { src:"{{ url_for('static',filename='audio/song4.mp3') }}", title:"Oru Venal Puzhayil",     lang:"Malayalam" },
    { src:"{{ url_for('static',filename='audio/song5.mp3') }}", title:"Kya Hua Tera Wada",      lang:"Hindi"     },
    { src:"{{ url_for('static',filename='audio/song6.mp3') }}", title:"Parayathe Ariyathe",     lang:"Malayalam" },
  ];
  const EMOJIS = ['🎵','🎶','🎼','🎤','🎸','🎹'];
  const durations = new Array(SONGS.length).fill(null);
  let queue = SONGS.map((_,i)=>i), origQueue = SONGS.map((_,i)=>i);
  let qpos = 0, playing = false, shuffle = false, repeat = false;

  const audio=document.getElementById('audio'), vinyl=document.getElementById('vinyl'),
    arm=document.getElementById('arm'), artGlow=document.getElementById('art-glow'),
    miniDisc=document.getElementById('mini-disc'), npTitle=document.getElementById('np-title'),
    npLang=document.getElementById('np-lang'), miniTitle=document.getElementById('mini-title'),
    miniSub=document.getElementById('mini-sub'), playIcon=document.getElementById('play-icon'),
    miniIcon=document.getElementById('mini-icon'), pfill=document.getElementById('pfill'),
    pthumb=document.getElementById('pthumb'), prog=document.getElementById('prog'),
    curEl=document.getElementById('cur'), durEl=document.getElementById('dur'),
    miniProg=document.getElementById('mini-prog'), vfill=document.getElementById('vfill');

  const cvs=document.getElementById('viz'), ctx=cvs.getContext('2d'), N=46;
  const h=new Float32Array(N).fill(.05), tgt=new Float32Array(N).map(()=>Math.random()*.3+.05), spd=new Float32Array(N).map(()=>.03+Math.random()*.05);
  let vizOn=false;
  function sizeCanvas(){const r=cvs.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;cvs.width=Math.round(r.width*d);cvs.height=Math.round(r.height*d);}
  sizeCanvas(); new ResizeObserver(sizeCanvas).observe(cvs.parentElement);
  (function drawViz(){
    const W=cvs.width,H=cvs.height; ctx.clearRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#f5e0a0'); g.addColorStop(.5,'#e8cc7a'); g.addColorStop(1,'#5a3e10'); ctx.fillStyle=g;
    const slot=W/N,gap=Math.max(1,slot*.28),bw=slot-gap;
    for(let i=0;i<N;i++){
      if(vizOn){h[i]+=(tgt[i]-h[i])*spd[i];if(Math.abs(h[i]-tgt[i])<.008){tgt[i]=Math.random()*.9+.07;spd[i]=.02+Math.random()*.06;}}
      else{h[i]+=(0.04-h[i])*.09;}
      const bh=Math.max(2,h[i]*H),x=i*slot+gap/2,y=H-bh;
      ctx.beginPath();ctx.roundRect(x,y,bw,bh,2);ctx.fill();
    }
    requestAnimationFrame(drawViz);
  })();

  const PLAY_D='M8 5v14l11-7z', PAUSE_D='M6 19h4V5H6v14zm8-14v14h4V5h-4z';
  function setPlaying(on){
    playing=on;vizOn=on;
    vinyl.classList.toggle('playing',on); vinyl.classList.toggle('dim',!on);
    miniDisc.classList.toggle('playing',on); arm.classList.toggle('on',on); artGlow.classList.toggle('on',on);
    playIcon.querySelector('path').setAttribute('d',on?PAUSE_D:PLAY_D);
    miniIcon.querySelector('path').setAttribute('d',on?PAUSE_D:PLAY_D);
  }
  function setProgress(p){pfill.style.width=p+'%';pthumb.style.left=p+'%';miniProg.style.width=p+'%';prog.value=p;}
  function fmt(s){if(!s||isNaN(s))return'--:--';return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;}
  function animTitle(t){npTitle.classList.remove('anim');void npTitle.offsetWidth;npTitle.textContent=t;npTitle.classList.add('anim');}

  function renderPlaylist(){
    const cur=queue[qpos],tl=document.getElementById('tlist'); tl.innerHTML='';
    SONGS.forEach((s,i)=>{
      const isNow=i===cur,el=document.createElement('div'); el.className='titem'+(isNow?' now':'');
      el.innerHTML=`<div class="tnum-cell"><span class="tnum">${i+1}</span><div class="now-bars"><div class="nb" style="--nd:.38s;--nh:13px"></div><div class="nb" style="--nd:.55s;--nh:9px"></div><div class="nb" style="--nd:.44s;--nh:14px"></div></div></div><div class="tthumb">${EMOJIS[i]}</div><div class="ttext"><div class="ttitle">${s.title}</div><div class="tsub">${s.lang} · Cover</div></div><span class="tdur">${fmt(durations[i])}</span>`;
      el.addEventListener('click',()=>{const qi=queue.indexOf(i);if(qi!==-1)qpos=qi;else{queue.splice(qpos+1,0,i);qpos++;}loadAndPlay();});
      tl.appendChild(el);
    });
  }

  function renderQueue(){
    const ql=document.getElementById('qlist'); ql.innerHTML='';
    queue.forEach((si,qi)=>{
      const s=SONGS[si],isCur=qi===qpos,el=document.createElement('div'); el.className='qitem';el.draggable=true;el.dataset.qi=qi;
      if(isCur)el.style.borderColor='rgba(201,168,76,.3)';
      el.innerHTML=`<div class="qhandle"><span></span><span></span><span></span></div><div class="qpos">${isCur?'▶':qi+1}</div><div class="qinfo"><div class="qtitle">${s.title}</div><div class="qsub">${s.lang} · Cover</div></div><span class="qdur">${fmt(durations[si])}</span>${isCur?'<span class="qnow">Now</span>':''}`;
      el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',qi);setTimeout(()=>el.classList.add('dragging'),0);});
      el.addEventListener('dragend',()=>el.classList.remove('dragging'));
      el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('dragover');});
      el.addEventListener('dragleave',()=>el.classList.remove('dragover'));
      el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('dragover');const from=+e.dataTransfer.getData('text/plain'),to=+el.dataset.qi;if(from===to)return;const m=queue.splice(from,1)[0];queue.splice(to,0,m);if(from===qpos)qpos=to;else if(from<qpos&&to>=qpos)qpos--;else if(from>qpos&&to<=qpos)qpos++;renderQueue();renderPlaylist();});
      ql.appendChild(el);
    });
  }

  function loadAndPlay(){
    const s=SONGS[queue[qpos]]; audio.src=s.src;audio.load();
    animTitle(s.title); npLang.textContent=s.lang; miniTitle.textContent=s.title; miniSub.textContent=s.lang+' · Cover';
    setProgress(0);curEl.textContent='0:00';durEl.textContent='--:--';
    audio.play().then(()=>setPlaying(true)).catch(()=>{});
    renderPlaylist();renderQueue();
  }
  function togglePlay(){if(playing){audio.pause();setPlaying(false);}else{audio.play().then(()=>setPlaying(true)).catch(()=>{});}}
  function next(){qpos=(qpos+1)%queue.length;loadAndPlay();}
  function prev(){if(audio.currentTime>3){audio.currentTime=0;return;}qpos=(qpos-1+queue.length)%queue.length;loadAndPlay();}
  function doShuffle(){const cur=queue[qpos],rest=queue.filter((_,i)=>i!==qpos);for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}queue=[cur,...rest];qpos=0;}
  function undoShuffle(){const cur=queue[qpos];queue=[...origQueue];qpos=queue.indexOf(cur);}

  document.getElementById('btn-play').onclick=togglePlay;
  document.getElementById('mini-play').onclick=togglePlay;
  document.getElementById('btn-prev').onclick=prev;
  document.getElementById('btn-next').onclick=next;
  document.getElementById('mini-prev').onclick=prev;
  document.getElementById('mini-next').onclick=next;
  document.getElementById('btn-shuffle').onclick=()=>{shuffle=!shuffle;document.getElementById('btn-shuffle').classList.toggle('active',shuffle);shuffle?doShuffle():undoShuffle();renderQueue();renderPlaylist();};
  document.getElementById('btn-repeat').onclick=()=>{repeat=!repeat;document.getElementById('btn-repeat').classList.toggle('active',repeat);};
  audio.addEventListener('ended',()=>repeat?(audio.currentTime=0,audio.play()):next());
  audio.addEventListener('timeupdate',()=>{if(!audio.duration)return;const p=(audio.currentTime/audio.duration)*100;setProgress(p);curEl.textContent=fmt(audio.currentTime);durEl.textContent=fmt(audio.duration);});
  prog.addEventListener('input',()=>{setProgress(+prog.value);if(audio.duration)audio.currentTime=(prog.value/100)*audio.duration;});
  document.getElementById('vol').addEventListener('input',function(){audio.volume=this.value/100;vfill.style.width=this.value+'%';});
  audio.volume=0.8;
  document.querySelectorAll('.tab').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));btn.classList.add('on');document.getElementById('panel-'+btn.dataset.panel).classList.add('on');});});

  let pending=false;
  SONGS.forEach((s,i)=>{const t=new Audio(s.src);t.addEventListener('loadedmetadata',()=>{durations[i]=t.duration;if(pending)return;pending=true;requestAnimationFrame(()=>{renderPlaylist();renderQueue();pending=false;});});});

  renderPlaylist();renderQueue();setProgress(0);
  audio.src=SONGS[0].src;
})();
</script>
</body>
</html>
