<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Through The Years</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }

    .bg-fixed {
      position: fixed; inset: 0; z-index: 0;
      background-image: url("/static/AD_pics/Aadhi_bg.jpg");
      background-size: cover; background-position: center;
    }
    .bg-fixed::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(
        160deg,
        rgba(255,240,210,0.60) 0%,
        rgba(255,220,170,0.50) 50%,
        rgba(200,140,80,0.40) 100%
      );
    }

    body {
      min-height: 100vh; min-height: 100dvh;
      font-family: 'Outfit', sans-serif;
      color: #2a1a0e;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top))
               max(16px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom))
               max(16px, env(safe-area-inset-left));
    }

    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      background: rgba(255,248,235,0.76);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(210,170,100,0.35);
      border-radius: clamp(20px, 5vw, 28px);
      padding: clamp(18px, 5vw, 32px) clamp(16px, 5vw, 24px) clamp(16px, 4vw, 24px);
      box-shadow:
        0 8px 40px rgba(140,80,20,0.18),
        0 2px 8px rgba(140,80,20,0.1),
        inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .header { text-align: center; margin-bottom: clamp(14px, 4vw, 24px); }

    .eyebrow {
      font-size: clamp(0.6rem, 2.2vw, 0.68rem);
      letter-spacing: 0.18em; text-transform: uppercase;
      color: #b07840; font-weight: 500; margin-bottom: 6px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 7vw, 2.6rem);
      font-style: italic; font-weight: 400;
      color: #3a2010; line-height: 1.1;
    }

    .sub {
      margin-top: 4px;
      font-size: clamp(0.72rem, 2.5vw, 0.78rem);
      color: #9a6840; font-weight: 300;
    }

    /* ── Photo frame: two stacked images for crossfade ── */
    .photo-wrap {
      position: relative;
      border-radius: clamp(12px, 3vw, 18px); overflow: hidden;
      box-shadow:
        0 4px 24px rgba(100,50,10,0.22),
        0 0 0 3px rgba(210,170,100,0.3),
        0 0 0 6px rgba(255,248,235,0.6);
      aspect-ratio: 4/3;
      max-height: 48vh;
      background: #e8d5b0;
      margin-bottom: clamp(12px, 3.5vw, 20px);
    }

    .photo-wrap img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      z-index: 1;
    }

    #img-a {
      z-index: 1;
    }

    #img-b {
      z-index: 2;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .grain {
      position: absolute; inset: 0; pointer-events: none; z-index: 3;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      mix-blend-mode: multiply; opacity: 0.5;
    }

    .corner {
      position: absolute; width: 16px; height: 16px;
      border-color: rgba(180,130,60,0.5); border-style: solid;
      pointer-events: none; z-index: 4;
    }
    .corner.tl { top: 7px; left: 7px;   border-width: 2px 0 0 2px; }
    .corner.tr { top: 7px; right: 7px;  border-width: 2px 2px 0 0; }
    .corner.bl { bottom: 7px; left: 7px;  border-width: 0 0 2px 2px; }
    .corner.br { bottom: 7px; right: 7px; border-width: 0 2px 2px 0; }

    .photo-badge {
      position: absolute; bottom: 10px; right: 10px; z-index: 4;
      background: rgba(255,248,230,0.88);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(210,170,100,0.4);
      border-radius: 20px;
      padding: 3px 10px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.75rem, 2.5vw, 0.85rem); font-style: italic;
      color: #7a4820;
    }

    .swipe-hint {
      text-align: center;
      font-size: 0.68rem; color: #b07840;
      margin-bottom: clamp(8px, 2.5vw, 14px);
      letter-spacing: 0.04em; opacity: 0.8;
    }

    .dots {
      display: flex; justify-content: center;
      gap: clamp(5px, 1.8vw, 8px);
      margin-bottom: clamp(10px, 3vw, 18px);
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(160,100,40,0.2);
      border: 1.5px solid rgba(160,100,40,0.3);
      cursor: pointer;
      transition: background 0.25s, transform 0.2s, border-color 0.25s;
      position: relative;
    }
    .dot::after { content: ''; position: absolute; inset: -8px; border-radius: 50%; }
    .dot.active {
      background: #c07030;
      border-color: #c07030;
      transform: scale(1.35);
    }

    .slider-section { margin-bottom: clamp(12px, 3.5vw, 20px); }

    .slider-labels {
      display: flex; justify-content: space-between;
      font-size: 0.65rem; color: #b07840; margin-bottom: 8px;
      font-weight: 500; letter-spacing: 0.04em;
    }

    .slider-wrap {
      position: relative; height: 36px;
      display: flex; align-items: center;
    }

    .slider-track {
      position: absolute; left: 0; right: 0; height: 6px;
      background: rgba(180,130,60,0.18);
      border-radius: 3px; overflow: hidden; pointer-events: none;
    }
    .slider-fill {
      height: 100%; width: 0%;
      background: linear-gradient(to right, #e8a050, #c06020);
      border-radius: 3px; pointer-events: none;
      transition: width 0.12s ease;
    }

    input[type=range] {
      position: absolute; left: 0; right: 0; width: 100%;
      height: 36px; opacity: 0; cursor: pointer; z-index: 3;
      -webkit-appearance: none; appearance: none; margin: 0;
    }

    .slider-thumb-visual {
      position: absolute;
      width: clamp(24px, 6vw, 28px);
      height: clamp(24px, 6vw, 28px);
      border-radius: 50%;
      background: linear-gradient(135deg, #f0a060, #c05020);
      box-shadow: 0 2px 8px rgba(150,60,10,0.4), 0 0 0 3px rgba(255,248,235,0.9);
      left: 0%; transform: translateX(-50%);
      pointer-events: none; z-index: 2;
      transition: left 0.12s ease;
    }

    .nav-row {
      display: flex; align-items: center; justify-content: center;
      gap: clamp(12px, 4vw, 20px);
    }

    .nav-btn {
      width: clamp(48px, 13vw, 56px);
      height: clamp(48px, 13vw, 56px);
      border-radius: 50%;
      background: rgba(200,140,60,0.12);
      border: 1px solid rgba(200,140,60,0.3);
      color: #8a5020;
      font-size: clamp(1.1rem, 3.5vw, 1.3rem);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.1s;
      touch-action: manipulation;
    }
    .nav-btn:hover  { background: rgba(200,140,60,0.22); }
    .nav-btn:active { transform: scale(0.90); background: rgba(200,140,60,0.28); }
    .nav-btn:disabled { opacity: 0.28; cursor: default; transform: none; }

    .nav-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.95rem, 3vw, 1.1rem); font-style: italic;
      color: #7a4820; min-width: 72px; text-align: center;
    }

    .back-link {
      display: block; text-align: center;
      margin-top: clamp(14px, 4vw, 22px);
      color: #b07840;
      font-size: clamp(0.78rem, 2.5vw, 0.85rem);
      text-decoration: none; transition: color 0.2s;
      padding: 6px 0;
    }
    .back-link:hover { color: #6a3810; }
  </style>
</head>
<body>

<div class="bg-fixed"></div>

<div class="card">
  <div class="header">
    <div class="eyebrow">A Walk Through Time</div>
    <h1>Through The Years</h1>
    <div class="sub">10 moments · Slide or tap to explore</div>
  </div>

  <div class="photo-wrap" id="photo-wrap">
    <!-- Two layers: img-a always shows current, img-b fades in on top then we swap -->
    <img id="img-a" src="/static/AD_pics/Aadhi1.jpg" alt="Photo"/>
    <img id="img-b" src="" alt="Photo"/>
    <div class="grain"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="photo-badge" id="badge">Photo 1 of 10</div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="slider-section">
    <div class="slider-labels">
      <span>Earlier</span>
      <span>Later</span>
    </div>
    <div class="slider-wrap">
      <div class="slider-track"><div class="slider-fill" id="slider-fill"></div></div>
      <div class="slider-thumb-visual" id="slider-thumb"></div>
      <input type="range" id="slider" min="1" max="10" step="1" value="1">
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prev-btn" disabled>&#8592;</button>
    <div class="nav-label" id="nav-label">Photo 1</div>
    <button class="nav-btn" id="next-btn">&#8594;</button>
  </div>

  <a href="/memory" class="back-link">⬅ Back to Home</a>
</div>

<script>
  const IMAGES = {
    1:  "/static/AD_pics/Aadhi1.jpg",
    2:  "/static/AD_pics/Aadhi2.jpg",
    3:  "/static/AD_pics/Aadhi3.jpg",
    4:  "/static/AD_pics/Aadhi4.jpg",
    5:  "/static/AD_pics/Aadhi5.jpg",
    6:  "/static/AD_pics/Aadhi6.jpg",
    7:  "/static/AD_pics/Aadhi7.jpg",
    8:  "/static/AD_pics/Aadhi8.jpg",
    9:  "/static/AD_pics/Aadhi9.jpg",
    10: "/static/AD_pics/Aadhi10.jpg",
  };

  const total = 10;
  let current = 1;
  let transitioning = false;

  const imgA     = document.getElementById('img-a');
  const imgB     = document.getElementById('img-b');
  const slider   = document.getElementById('slider');
  const fill     = document.getElementById('slider-fill');
  const thumb    = document.getElementById('slider-thumb');
  const badge    = document.getElementById('badge');
  const navLabel = document.getElementById('nav-label');
  const prevBtn  = document.getElementById('prev-btn');
  const nextBtn  = document.getElementById('next-btn');
  const dotsWrap = document.getElementById('dots');
  const photoWrap = document.getElementById('photo-wrap');

  // Build dots
  for (let i = 1; i <= total; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 1 ? ' active' : '');
    d.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(d);
  }

  // Preload all images so they're cached before user reaches them
  Object.values(IMAGES).forEach(src => { const img = new Image(); img.src = src; });

  function updateChrome(idx) {
    const pct = ((idx - 1) / (total - 1)) * 100;
    fill.style.width     = pct + '%';
    thumb.style.left     = pct + '%';
    slider.value         = idx;
    badge.textContent    = `Photo ${idx} of ${total}`;
    navLabel.textContent = `Photo ${idx}`;
    prevBtn.disabled     = idx === 1;
    nextBtn.disabled     = idx === total;
    dotsWrap.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i + 1 === idx);
    });
  }

  function goTo(idx) {
    if (idx === current || idx < 1 || idx > total || transitioning) return;
    transitioning = true;
    current = idx;
    updateChrome(current);

    const nextSrc = IMAGES[idx];

    // Preload silently first so the crossfade is instant once it starts
    const loader = new Image();
    loader.onload = () => {
      // Point img-b (on top) at the new photo, then fade it in over img-a
      imgB.src = nextSrc;
      // Force a reflow so the transition fires from opacity:0
      imgB.getBoundingClientRect();
      imgB.style.opacity = '1';

      // Once faded in: make img-a take the new src, reset img-b instantly (no transition)
      setTimeout(() => {
        imgA.src = nextSrc;
        imgB.style.transition = 'none';
        imgB.style.opacity = '0';
        // Re-enable transition after reset so next fade works
        requestAnimationFrame(() => {
          imgB.style.transition = 'opacity 0.35s ease';
        });
        transitioning = false;
      }, 370);
    };
    loader.onerror = () => { imgA.src = nextSrc; transitioning = false; };
    loader.src = nextSrc;
  }

  slider.addEventListener('input', () => goTo(parseInt(slider.value)));
  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));

  // Swipe on photo
  let touchStartX = 0;
  photoWrap.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].clientX;
  }, { passive: true });
  photoWrap.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) {
      goTo(dx < 0 ? current + 1 : current - 1);
    }
  }, { passive: true });

  updateChrome(1);
</script>
</body>
</html>
