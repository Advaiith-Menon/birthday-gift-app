<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>A Super Movie</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }

    body {
      min-height: 100vh; min-height: 100dvh;
      background: #06060a;
      font-family: 'DM Sans', sans-serif;
      color: #f0f0f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top))
               max(16px, env(safe-area-inset-right))
               max(32px, env(safe-area-inset-bottom))
               max(16px, env(safe-area-inset-left));
      overflow-x: hidden;
    }

    /* ── Ambient background glow ── */
    .bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      overflow: hidden;
    }
    .glow1 {
      position: absolute;
      width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(232,50,80,0.12) 0%, transparent 70%);
      top: -200px; left: 50%; transform: translateX(-50%);
      animation: pulse-glow 6s ease-in-out infinite alternate;
    }
    .glow2 {
      position: absolute;
      width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(120,40,200,0.08) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      animation: pulse-glow 8s ease-in-out infinite alternate-reverse;
    }
    @keyframes pulse-glow {
      from { opacity: 0.6; transform: translateX(-50%) scale(1); }
      to   { opacity: 1;   transform: translateX(-50%) scale(1.1); }
    }
    .glow2 { animation: pulse-glow2 8s ease-in-out infinite alternate-reverse; }
    @keyframes pulse-glow2 {
      from { opacity: 0.5; transform: scale(1); }
      to   { opacity: 1;   transform: scale(1.15); }
    }

    /* ── Film strip top decoration ── */
    .filmstrip {
      position: relative; z-index: 1;
      display: flex; gap: 6px;
      margin-bottom: 28px;
      opacity: 0.35;
    }
    .film-hole {
      width: 12px; height: 10px;
      border-radius: 2px;
      border: 1.5px solid rgba(255,255,255,0.5);
      background: transparent;
    }

    /* ── Header ── */
    .header {
      position: relative; z-index: 1;
      text-align: center;
      margin-bottom: clamp(20px, 5vw, 36px);
    }

    .eyebrow {
      font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(232,50,80,0.8); font-weight: 500; margin-bottom: 10px;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.8rem, 12vw, 5rem);
      letter-spacing: 0.04em;
      line-height: 1;
      background: linear-gradient(135deg, #fff 30%, rgba(232,50,80,0.9) 70%, #9b4dca 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .rating-row {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-top: 10px;
    }
    .rating-badge {
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em;
      padding: 3px 8px; border-radius: 4px;
      border: 1px solid rgba(232,50,80,0.5);
      color: rgba(232,50,80,0.9);
    }
    .dot-sep { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.2); }
    .genre-tag {
      font-size: 0.7rem; color: rgba(255,255,255,0.4); letter-spacing: 0.06em;
    }

    /* ── Video wrapper ── */
    .video-outer {
      position: relative; z-index: 1;
      width: 100%; max-width: 500px;
    }

    /* theatre curtain lines */
    .curtain-line {
      position: absolute; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(to bottom, transparent, rgba(180,30,60,0.15), transparent);
      pointer-events: none; z-index: 2;
    }
    .curtain-line.left  { left: -8px; }
    .curtain-line.right { right: -8px; }

    .video-frame {
      position: relative;
      border-radius: clamp(10px, 2.5vw, 16px); overflow: hidden;
      background: #000;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05),
        0 0 40px rgba(232,50,80,0.12),
        0 20px 60px rgba(0,0,0,0.7);
    }

    /* scan line overlay */
    .video-frame::after {
      content: '';
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      border-radius: inherit;
    }

    video {
      width: 100%; display: block;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: inherit;
    }

    /* ── Info bar below video ── */
    .info-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 16px; padding: 0 4px;
    }

    .caption {
      font-size: clamp(0.78rem, 2.5vw, 0.88rem);
      color: rgba(255,255,255,0.45);
      font-style: italic; font-weight: 300;
    }

    .stars {
      display: flex; gap: 3px;
      font-size: clamp(0.7rem, 2vw, 0.82rem);
      color: rgba(232,50,80,0.7);
    }

    /* ── Bottom filmstrip ── */
    .filmstrip-bottom {
      position: relative; z-index: 1;
      display: flex; align-items: center; gap: 5px;
      margin-top: 28px; opacity: 0.2;
    }
    .film-frame {
      width: clamp(20px, 5vw, 28px);
      height: clamp(14px, 3.5vw, 20px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 1px;
    }
    .film-frame.lit { background: rgba(255,255,255,0.15); }

    /* ── Back link ── */
    .back-link {
      position: relative; z-index: 1;
      display: inline-block;
      margin-top: clamp(24px, 5vw, 36px);
      color: rgba(255,255,255,0.3);
      font-size: 0.82rem; text-decoration: none;
      transition: color 0.2s; padding: 6px 0;
      letter-spacing: 0.03em;
    }
    .back-link:hover { color: rgba(232,50,80,0.8); }
  </style>
</head>
<body>

  <div class="bg-glow">
    <div class="glow1"></div>
    <div class="glow2"></div>
  </div>

  <!-- Film strip top -->
  <div class="filmstrip">
    <div class="film-hole"></div><div class="film-hole"></div><div class="film-hole"></div>
    <div class="film-hole"></div><div class="film-hole"></div><div class="film-hole"></div>
    <div class="film-hole"></div><div class="film-hole"></div><div class="film-hole"></div>
  </div>

  <div class="header">
    <div class="eyebrow">Now Screening</div>
    <h1>A Super Movie</h1>
    <div class="rating-row">
      <span class="rating-badge">★ FEATURED</span>
      <div class="dot-sep"></div>
      <span class="genre-tag">Memory · Short Film</span>
    </div>
  </div>

  <div class="video-outer">
    <div class="curtain-line left"></div>
    <div class="curtain-line right"></div>
    <div class="video-frame">
      <video controls preload="metadata" poster="">
        <source src="/static/aadhi_video.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="info-bar">
      <span class="caption">Enjoy the show…</span>
      <div class="stars">🎬 🎥 🍿</div>
    </div>
  </div>

  <!-- Film strip bottom -->
  <div class="filmstrip-bottom">
    <div class="film-frame lit"></div>
    <div class="film-frame"></div>
    <div class="film-frame lit"></div>
    <div class="film-frame"></div>
    <div class="film-frame lit"></div>
    <div class="film-frame"></div>
    <div class="film-frame lit"></div>
  </div>

  <a href="/memory" class="back-link">⬅ Back to Home</a>

</body>
</html>
