<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>Headache-AI</title>

  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#080b12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:       #080b12;
      --surface:  #0e1320;
      --surface2: #141927;
      --border:   rgba(255,255,255,0.07);
      --border2:  rgba(255,255,255,0.12);
      --accent:   #7b61ff;
      --accent2:  #a78bfa;
      --teal:     #2dd4bf;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --glow:     rgba(123,97,255,0.18);
    }

    /*
      THE KEY INSIGHT:
      - html+body fill the viewport as a flex column
      - header is sticky (stays at top, part of normal flow)
      - #main takes up remaining space with flex:1
      - When keyboard opens on mobile, the viewport shrinks,
        the whole column shrinks, and the input naturally rises.
        No JS needed for keyboard handling.
    */

    html {
      height: 100%;
      background: var(--bg);
    }

    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(123,97,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123,97,255,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* ── HEADER: sticky, never scrolls away ── */
    #app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-inner {
      max-width: 780px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar-wrap { position: relative; width: 56px; height: 56px; flex-shrink: 0; }

    #avatar-container {
      width: 56px; height: 56px;
      border-radius: 50%; overflow: hidden;
      border: 2px solid var(--accent);
      box-shadow: 0 0 16px var(--glow);
      position: relative;
      background: var(--surface2);
    }
    #avatar-container img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .avatar-ring {
      position: absolute; inset: -5px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      opacity: 0; transition: opacity 0.3s;
    }
    .avatar-ring.active {
      opacity: 1;
      animation: ringPulse 1.2s ease-in-out infinite;
    }
    @keyframes ringPulse {
      0%, 100% { transform: scale(1);    opacity: 0.9; }
      50%       { transform: scale(1.18); opacity: 0.15; }
    }

    .header-info { flex: 1; min-width: 0; }
    .header-name {
      font-family: 'Space Mono', monospace;
      font-size: 0.95rem; font-weight: 700;
      color: var(--text); letter-spacing: 0.03em;
    }
    .header-status {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.7rem; color: var(--muted);
      margin-top: 3px; letter-spacing: 0.04em;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--teal); box-shadow: 0 0 6px var(--teal);
      animation: dotBlink 2.5s ease-in-out infinite;
    }
    @keyframes dotBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ── MAIN: flex column, fills all space below header ── */
    #main {
      flex: 1;
      min-height: 0;          /* lets it shrink when keyboard opens */
      display: flex;
      flex-direction: column;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ── CHAT LOG: scrollable, fills remaining space ── */
    #chat-log {
      flex: 1;
      min-height: 0;          /* critical — without this it won't scroll */
      overflow-y: auto;
      padding: 24px 0 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }
    #chat-log::-webkit-scrollbar { width: 4px; }
    #chat-log::-webkit-scrollbar-track { background: transparent; }
    #chat-log::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

    /* messages */
    .msg { display: flex; max-width: 85%; animation: msgIn 0.22s ease-out both; }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user { align-self: flex-end; }
    .msg.bot  { align-self: flex-start; }

    .bubble {
      padding: 10px 15px;
      border-radius: 18px;
      line-height: 1.65;
      font-size: 0.9rem;
      word-break: break-word;
    }
    .user .bubble {
      background: linear-gradient(135deg, #5d3aff, #8b68ff);
      color: #fff;
      border-bottom-right-radius: 5px;
      box-shadow: 0 2px 18px rgba(93,58,255,0.28);
    }
    .bot .bubble {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }
    .bubble.error {
      background: rgba(239,68,68,0.1);
      border-color: rgba(239,68,68,0.3);
      color: #fca5a5;
    }

    /* typing */
    .typing-bubble {
      display: flex; align-items: center; gap: 5px;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 18px;
      border-bottom-left-radius: 5px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--teal);
      animation: typeBounce 1.1s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.30s; }
    @keyframes typeBounce {
      0%, 60%, 100% { transform: translateY(0);   opacity: 0.35; }
      30%            { transform: translateY(-5px); opacity: 1; }
    }

    /* intro */
    .intro {
      align-self: center; text-align: center;
      padding: 48px 20px;
      color: var(--muted); font-size: 0.85rem; line-height: 1.9;
    }
    .intro-title {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 1.2rem; color: var(--accent2);
      margin-bottom: 6px;
    }

    .divider { flex-shrink: 0; height: 1px; background: var(--border); }

    /* ── INPUT: always visible at bottom ── */
    .input-wrap {
      flex-shrink: 0;
      padding: 12px 0;
      padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
    }

    .input-box {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 10px 10px 10px 16px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .input-box:focus-within {
      border-color: rgba(123,97,255,0.5);
      box-shadow: 0 0 0 3px rgba(123,97,255,0.1);
    }

    #user-input {
      flex: 1; background: transparent;
      border: none; outline: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem; line-height: 1.55;
      resize: none;
      height: 24px; max-height: 120px; overflow-y: hidden;
    }
    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 38px; height: 38px;
      border-radius: 10px; border: none;
      background: linear-gradient(135deg, #5d3aff, #8b68ff);
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 2px 14px rgba(93,58,255,0.4);
    }
    #send-btn:hover  { transform: scale(1.07); box-shadow: 0 4px 22px rgba(93,58,255,0.55); }
    #send-btn:active { transform: scale(0.94); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
  </style>
</head>
<body>

  <!-- STICKY HEADER — sticks to top of viewport, shrinks with it when keyboard opens -->
  <header id="app-header">
    <div class="header-inner">
      <div class="avatar-wrap">
        <div id="avatar-container">
          <img id="av-idle" src="{{ url_for('get_image', filename='avatar_idle.jpg') }}" alt="Avatar">
          <img id="av-a"    src="{{ url_for('get_image', filename='avatar1.jpg') }}"     alt="" style="display:none;">
          <img id="av-b"    src="{{ url_for('get_image', filename='avatar2.jpg') }}"     alt="" style="display:none;">
        </div>
        <div class="avatar-ring" id="avRing"></div>
      </div>
      <div class="header-info">
        <div class="header-name">Headache-AI</div>
        <div class="header-status">
          <span class="status-dot"></span>
          <span id="status-text">online · ready</span>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN — flex:1, shrinks when keyboard opens, input stays visible -->
  <div id="main">
    <div id="chat-log">
      <div class="intro">
        <span class="intro-title">Hello there ✦</span>
        I'm listening. Say something.
      </div>
    </div>

    <div class="divider"></div>

    <div class="input-wrap">
      <div class="input-box">
        <textarea id="user-input" placeholder="Type something…" rows="1"></textarea>
        <button id="send-btn" aria-label="Send">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

<script>
(function () {
  const chatLog    = document.getElementById('chat-log');
  const input      = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');
  const statusText = document.getElementById('status-text');
  const avRing     = document.getElementById('avRing');
  const avIdle     = document.getElementById('av-idle');
  const avA        = document.getElementById('av-a');
  const avB        = document.getElementById('av-b');

  /* auto-scroll whenever anything changes in the chat */
  new MutationObserver(() => {
    chatLog.scrollTop = chatLog.scrollHeight;
  }).observe(chatLog, { childList: true, subtree: true });

  /* textarea auto-grow */
  input.addEventListener('input', () => {
    input.style.height = '24px';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    input.style.overflowY = input.scrollHeight > 120 ? 'auto' : 'hidden';
  });

  /* avatar */
  let avTimer = null;
  function startAvatar() {
    avIdle.style.display = 'none';
    avA.style.display = 'block'; avB.style.display = 'none';
    avRing.classList.add('active');
    avTimer = setInterval(() => {
      const a = avA.style.display === 'block';
      avA.style.display = a ? 'none' : 'block';
      avB.style.display = a ? 'block' : 'none';
    }, 400);
  }
  function stopAvatar() {
    clearInterval(avTimer); avTimer = null;
    avA.style.display = 'none'; avB.style.display = 'none';
    avIdle.style.display = 'block';
    avRing.classList.remove('active');
  }

  /* typing indicator */
  let typingEl = null;
  function showTyping() {
    typingEl = document.createElement('div');
    typingEl.className = 'msg bot';
    typingEl.innerHTML = '<div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    chatLog.appendChild(typingEl);
  }
  function hideTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

  /* add message */
  function addMsg(text, role, extra) {
    const intro = chatLog.querySelector('.intro');
    if (intro) intro.remove();
    const row = document.createElement('div');
    row.className = 'msg ' + role;
    const bub = document.createElement('div');
    bub.className = 'bubble' + (extra ? ' ' + extra : '');
    bub.textContent = text;
    row.appendChild(bub);
    chatLog.appendChild(row);
  }

  /* send */
  let busy = false;
  async function send() {
    if (busy) return;
    const msg = input.value.trim();
    if (!msg) return;
    busy = true;

    addMsg(msg, 'user');
    input.value = ''; input.style.height = '24px';
    input.disabled = true; sendBtn.disabled = true;
    statusText.textContent = 'thinking…';
    startAvatar(); showTyping();

    try {
      const res   = await fetch('/chat', {
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify({ message: msg })
      });
      const data  = await res.json();
      const reply = data.reply;
      hideTyping(); stopAvatar();
      statusText.textContent = 'online · ready';

      if (reply === '__UNLOCK__') {
        addMsg('Yeah, That is true!!!', 'bot');
        setTimeout(() => { window.location.href = '/unlock'; }, 1500);
      } else {
        addMsg(reply, 'bot');
      }
    } catch (err) {
      hideTyping(); stopAvatar();
      statusText.textContent = 'online · ready';
      addMsg('❌ Oops! I zoned out!!!', 'bot', 'error');
      console.error(err);
    }

    input.disabled = false; sendBtn.disabled = false;
    busy = false; input.focus();
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  window.sendMessage = send;
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('{{ url_for("static", filename="service-worker.js") }}')
        .then(r => console.log('SW:', r.scope))
        .catch(e => console.error('SW fail:', e));
    });
  }
</script>

</body>
</html>
