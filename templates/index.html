<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Headache-AI</title>

  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#FF4D6D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:       #080b12;
      --surface:  #0e1320;
      --surface2: #141927;
      --border:   rgba(255,255,255,0.07);
      --border2:  rgba(255,255,255,0.12);
      --accent:   #7b61ff;
      --accent2:  #a78bfa;
      --teal:     #2dd4bf;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --glow:     rgba(123,97,255,0.18);
      --header-h: 97px; /* approximate header height — adjust if needed */
    }

    html { height: 100%; height: -webkit-fill-available; }
    body {
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(123,97,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123,97,255,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 70% at 50% 40%, transparent 30%, rgba(8,11,18,0.88) 100%);
      pointer-events: none; z-index: 0;
    }

    /* ── FIXED HEADER ── */
    .app-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      background: var(--bg); /* prevent content bleeding through */
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px max(16px, calc((100% - 780px)/2 + 16px)) 14px;
      border-bottom: 1px solid var(--border);
    }

    /* ── SCROLLABLE SHELL (sits below fixed header) ── */
    .shell {
      position: fixed;
      top: var(--header-h); left: 0; right: 0; bottom: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      max-width: 780px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Avatar */
    .header-avatar { position: relative; width: 64px; height: 64px; flex-shrink: 0; }

    #avatar-container {
      width: 64px; height: 64px;
      border-radius: 50%; overflow: hidden;
      border: 2px solid var(--accent);
      box-shadow: 0 0 16px var(--glow);
      position: relative;
    }
    #avatar-container img {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; border-radius: 50%;
    }

    .avatar-ring {
      position: absolute; inset: -5px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      opacity: 0; transition: opacity 0.3s;
    }
    .avatar-ring.active { opacity: 1; animation: ringPulse 1.2s ease-in-out infinite; }
    @keyframes ringPulse {
      0%, 100% { transform: scale(1);    opacity: 0.9; }
      50%       { transform: scale(1.18); opacity: 0.15; }
    }

    .header-info { flex: 1; min-width: 0; }
    .header-name {
      font-family: 'Space Mono', monospace;
      font-size: 0.95rem; font-weight: 700;
      color: var(--text); letter-spacing: 0.03em;
    }
    .header-status {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.7rem; color: var(--muted);
      margin-top: 3px; letter-spacing: 0.04em;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--teal); box-shadow: 0 0 6px var(--teal);
      flex-shrink: 0; animation: dotBlink 2.5s ease-in-out infinite;
    }
    @keyframes dotBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ── Chat log ── */
    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }
    #chat-log::-webkit-scrollbar { width: 4px; }
    #chat-log::-webkit-scrollbar-track { background: transparent; }
    #chat-log::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

    /* Messages */
    .message { display: flex; max-width: 85%; animation: msgIn 0.22s ease-out both; }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message.user-msg { align-self: flex-end; }
    .message.bot-msg  { align-self: flex-start; }

    .msg-bubble {
      padding: 10px 15px; border-radius: 18px;
      line-height: 1.65; font-size: 0.9rem; word-break: break-word;
    }
    .user-msg .msg-bubble {
      background: linear-gradient(135deg, #5d3aff, #8b68ff);
      color: #fff; border-bottom-right-radius: 5px;
      box-shadow: 0 2px 18px rgba(93,58,255,0.28);
    }
    .bot-msg .msg-bubble {
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-bottom-left-radius: 5px;
    }
    .msg-bubble.error {
      background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #fca5a5;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex; align-items: center; gap: 5px;
      padding: 12px 16px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 18px; border-bottom-left-radius: 5px;
    }
    .typing-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--teal); animation: typingBounce 1.1s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.30s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0);   opacity: 0.35; }
      30%            { transform: translateY(-5px); opacity: 1; }
    }

    /* Divider */
    .chat-divider { flex-shrink: 0; height: 1px; background: var(--border); }

    /* Input area */
    .input-wrap {
      flex-shrink: 0;
      padding: 12px 0;
      padding-bottom: max(18px, env(safe-area-inset-bottom, 18px));
    }
    #input-area {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 16px; padding: 10px 10px 10px 16px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    #input-area:focus-within {
      border-color: rgba(123,97,255,0.5);
      box-shadow: 0 0 0 3px rgba(123,97,255,0.1);
    }
    #user-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: 'Inter', sans-serif;
      font-size: 0.9rem; line-height: 1.55; resize: none;
      height: 24px; max-height: 120px; overflow-y: hidden;
    }
    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 38px; height: 38px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #5d3aff, #8b68ff);
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 2px 14px rgba(93,58,255,0.4);
    }
    #send-btn:hover  { transform: scale(1.07); box-shadow: 0 4px 22px rgba(93,58,255,0.55); }
    #send-btn:active { transform: scale(0.94); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Intro */
    .intro-msg {
      align-self: center; text-align: center;
      padding: 40px 20px; color: var(--muted);
      font-size: 0.85rem; line-height: 1.9;
    }
    .intro-title {
      font-family: 'Space Mono', monospace;
      font-size: 1.2rem; color: var(--accent2);
      margin-bottom: 6px; display: block;
    }
  </style>
</head>
<body>

<!-- FIXED HEADER — outside .shell so it never moves -->
<header class="app-header">
  <div class="header-avatar">
    <div id="avatar-container">
      <img id="avatar-static" src="{{ url_for('get_image', filename='avatar_idle.jpg') }}" alt="Avatar">
      <img id="avatar-a"      src="{{ url_for('get_image', filename='avatar1.jpg') }}"     alt="Avatar A" style="display:none;">
      <img id="avatar-b"      src="{{ url_for('get_image', filename='avatar2.jpg') }}"     alt="Avatar B" style="display:none;">
    </div>
    <div class="avatar-ring" id="avatarRing"></div>
  </div>

  <div class="header-info">
    <div class="header-name">Headache-AI</div>
    <div class="header-status">
      <span class="status-dot"></span>
      <span id="status-text">online · ready</span>
    </div>
  </div>
</header>

<!-- SCROLLABLE SHELL — starts below the fixed header -->
<div class="shell">

  <div id="chat-log">
    <div class="intro-msg">
      <span class="intro-title">Hello there ✦</span>
      I'm listening. Say something.
    </div>
  </div>

  <div class="chat-divider"></div>

  <div class="input-wrap">
    <div id="input-area">
      <textarea id="user-input" placeholder="Type something..." rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {

    const chatLog    = document.getElementById('chat-log');
    const userInput  = document.getElementById('user-input');
    const sendBtn    = document.getElementById('send-btn');
    const statusText = document.getElementById('status-text');
    const avatarRing = document.getElementById('avatarRing');
    let avatarInterval;

    /* ── Measure real header height and apply as CSS var ── */
    function syncHeaderHeight() {
      const h = document.querySelector('.app-header').getBoundingClientRect().height;
      document.documentElement.style.setProperty('--header-h', h + 'px');
    }
    syncHeaderHeight();
    window.addEventListener('resize', syncHeaderHeight);

    /* ── Auto-scroll helper ── */
    function scrollToBottom() {
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    /* MutationObserver: auto-scroll whenever chat content changes */
    new MutationObserver(scrollToBottom).observe(chatLog, { childList: true, subtree: true });

    /* Auto-grow textarea */
    userInput.addEventListener('input', () => {
      userInput.style.height = '24px';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
      userInput.style.overflowY = userInput.scrollHeight > 120 ? 'auto' : 'hidden';
    });

    /* Avatar */
    function startAvatarAnimation() {
      const a = document.getElementById('avatar-a');
      const b = document.getElementById('avatar-b');
      document.getElementById('avatar-static').style.display = 'none';
      a.style.display = 'block'; b.style.display = 'none';
      avatarRing.classList.add('active');
      avatarInterval = setInterval(() => {
        if (a.style.display === 'block') { a.style.display = 'none'; b.style.display = 'block'; }
        else { a.style.display = 'block'; b.style.display = 'none'; }
      }, 400);
    }
    function stopAvatarAnimation() {
      clearInterval(avatarInterval);
      document.getElementById('avatar-a').style.display = 'none';
      document.getElementById('avatar-b').style.display = 'none';
      document.getElementById('avatar-static').style.display = 'block';
      avatarRing.classList.remove('active');
    }

    /* Typing indicator */
    let typingEl = null;
    function showTyping() {
      typingEl = document.createElement('div');
      typingEl.className = 'message bot-msg';
      typingEl.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
      chatLog.appendChild(typingEl);
      /* MutationObserver handles the scroll */
    }
    function hideTyping() {
      if (typingEl) { typingEl.remove(); typingEl = null; }
    }

    /* Append message */
    function appendMessage(text, role, extraClass) {
      const intro = chatLog.querySelector('.intro-msg');
      if (intro) intro.remove();

      const wrap   = document.createElement('div');
      wrap.className = 'message ' + (role === 'user' ? 'user-msg' : 'bot-msg');
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble' + (extraClass ? ' ' + extraClass : '');
      bubble.textContent = text;
      wrap.appendChild(bubble);
      chatLog.appendChild(wrap);
      /* MutationObserver handles the scroll */
    }

    /* Debounce */
    function debounce(fn, delay) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
    }

    /* Send */
    const sendMessage = debounce(async function () {
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage(message, 'user');
      userInput.value = '';
      userInput.style.height = '24px';
      userInput.disabled = true;
      sendBtn.disabled  = true;
      statusText.textContent = 'thinking...';

      startAvatarAnimation();
      showTyping();

      try {
        const res  = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        const reply = data.reply;

        hideTyping();
        stopAvatarAnimation();
        statusText.textContent = 'online · ready';

        if (reply === "__UNLOCK__") {
          appendMessage("Yeah, That is true!!!", 'bot');
          setTimeout(() => { window.location.href = "/unlock"; }, 1500);
        } else {
          appendMessage(reply, 'bot');
        }

      } catch (err) {
        hideTyping();
        stopAvatarAnimation();
        statusText.textContent = 'online · ready';
        appendMessage("❌ Oops! I zoned out!!!", 'bot', 'error');
        console.error("Chat error:", err);
      }

      userInput.disabled = false;
      sendBtn.disabled  = false;
      userInput.focus();
    }, 400);

    /* Enter key */
    userInput.addEventListener('keypress', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    window.sendMessage = sendMessage;

    /* Keep layout anchored when mobile keyboard opens */
    if (window.visualViewport) {
      const shell = document.querySelector('.shell');
      function onViewportResize() {
        shell.style.height = (window.visualViewport.height - parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-h'))) + 'px';
      }
      window.visualViewport.addEventListener('resize', onViewportResize);
      window.visualViewport.addEventListener('scroll', onViewportResize);
      onViewportResize();
    }
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('{{ url_for("static", filename="service-worker.js") }}')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.error('SW failed:', err));
    });
  }
</script>

</body>
</html>
