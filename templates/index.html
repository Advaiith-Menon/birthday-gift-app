<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Headache-AI</title>

  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --surface2:  #18181f;
      --surface3:  #1e1e27;
      --border:    rgba(255,255,255,0.06);
      --border2:   rgba(255,255,255,0.1);
      --accent:    #c8ff57;       /* electric lime — the signature color */
      --accent-dim: rgba(200,255,87,0.12);
      --accent-glow: rgba(200,255,87,0.2);
      --text:      #f0ede8;
      --text2:     #7a7880;
      --user-bg:   #1f1f2a;
      --user-border: rgba(200,255,87,0.25);
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
    }

    /* subtle grain overlay */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      opacity: 0.5;
    }

    /* ═══════════════════════════════════════
       FIXED HEADER — never moves
    ═══════════════════════════════════════ */
    #app-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* avatar */
    .avatar-wrap {
      position: relative;
      width: 46px; height: 46px;
      flex-shrink: 0;
    }
    .avatar-img-wrap {
      width: 46px; height: 46px;
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid var(--border2);
      position: relative;
      background: var(--surface2);
    }
    .avatar-img-wrap img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .avatar-pulse {
      position: absolute;
      inset: -4px;
      border-radius: 18px;
      border: 1.5px solid var(--accent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .avatar-pulse.active {
      opacity: 1;
      animation: pulsing 1.4s ease-in-out infinite;
    }
    @keyframes pulsing {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50%       { transform: scale(1.12); opacity: 0.1; }
    }

    .header-meta { flex: 1; min-width: 0; }
    .header-name {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
    }
    .header-status {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem;
      color: var(--text2);
      margin-top: 2px;
      letter-spacing: 0.03em;
    }
    .status-pip {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow);
      flex-shrink: 0;
      animation: pip 2.8s ease-in-out infinite;
    }
    @keyframes pip {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }

    /* ═══════════════════════════════════════
       MAIN LAYOUT — sits below fixed header
    ═══════════════════════════════════════ */
    #layout {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      /* top is set by JS after measuring header */
      display: flex;
      flex-direction: column;
      max-width: 760px;
      margin: 0 auto;
    }

    /* ═══════════════════════════════════════
       CHAT LOG — scrollable middle
    ═══════════════════════════════════════ */
    #chat-log {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 28px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }
    #chat-log::-webkit-scrollbar { width: 3px; }
    #chat-log::-webkit-scrollbar-track { background: transparent; }
    #chat-log::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ── Messages ── */
    .msg {
      display: flex;
      animation: fadeUp 0.2s ease-out both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { justify-content: flex-end; }
    .msg.bot  { justify-content: flex-start; }

    .bubble {
      max-width: 78%;
      padding: 10px 15px;
      line-height: 1.68;
      font-size: 0.9rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      border-radius: 18px 18px 4px 18px;
      color: var(--text);
    }

    .bot .bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      color: var(--text);
    }

    .bubble.error {
      background: rgba(255, 80, 80, 0.08);
      border-color: rgba(255, 80, 80, 0.25);
      color: #ff9090;
    }

    /* typing dots */
    .typing-bubble {
      display: flex; align-items: center; gap: 5px;
      padding: 14px 18px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
    }
    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.14s; }
    .dot:nth-child(3) { animation-delay: 0.28s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0);   opacity: 0.3; }
      30%            { transform: translateY(-5px); opacity: 1; }
    }

    /* intro */
    .intro {
      align-self: center;
      text-align: center;
      padding: 48px 24px;
      color: var(--text2);
      font-size: 0.85rem;
      line-height: 2;
    }
    .intro-title {
      display: block;
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    /* ── divider ── */
    .divider {
      flex-shrink: 0;
      height: 1px;
      background: var(--border);
      margin: 0 20px;
    }

    /* ═══════════════════════════════════════
       INPUT AREA
    ═══════════════════════════════════════ */
    .input-wrap {
      flex-shrink: 0;
      padding: 12px 20px;
      padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 10px 10px 10px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-box:focus-within {
      border-color: rgba(200,255,87,0.3);
      box-shadow: 0 0 0 3px rgba(200,255,87,0.06);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none; outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      line-height: 1.55;
      resize: none;
      height: 24px;
      max-height: 120px;
      overflow-y: hidden;
    }
    #user-input::placeholder { color: var(--text2); }

    #send-btn {
      width: 36px; height: 36px;
      border-radius: 10px; border: none;
      background: var(--accent);
      color: #0a0a0f;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 12px rgba(200,255,87,0.25);
    }
    #send-btn:hover  { transform: scale(1.07); box-shadow: 0 4px 20px rgba(200,255,87,0.4); }
    #send-btn:active { transform: scale(0.93); }
    #send-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; box-shadow: none; }
  </style>
</head>
<body>

  <!-- ═══ FIXED HEADER ═══ -->
  <header id="app-header">
    <div class="header-inner">
      <div class="avatar-wrap">
        <div class="avatar-img-wrap">
          <img id="av-idle" src="{{ url_for('get_image', filename='avatar_idle.jpg') }}" alt="Avatar">
          <img id="av-a"    src="{{ url_for('get_image', filename='avatar1.jpg') }}"     alt="" style="display:none;">
          <img id="av-b"    src="{{ url_for('get_image', filename='avatar2.jpg') }}"     alt="" style="display:none;">
        </div>
        <div class="avatar-pulse" id="avPulse"></div>
      </div>

      <div class="header-meta">
        <div class="header-name">Headache-AI</div>
        <div class="header-status">
          <span class="status-pip"></span>
          <span id="status-text">online · ready</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ═══ SCROLLABLE LAYOUT (anchored below header) ═══ -->
  <div id="layout">
    <div id="chat-log">
      <div class="intro">
        <span class="intro-title">Hello there ✦</span>
        I'm listening. Say something.
      </div>
    </div>

    <div class="divider"></div>

    <div class="input-wrap">
      <div class="input-box">
        <textarea id="user-input" placeholder="Type something…" rows="1"></textarea>
        <button id="send-btn" aria-label="Send">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

<script>
(function () {

  /* ── elements ── */
  const chatLog    = document.getElementById('chat-log');
  const userInput  = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');
  const statusText = document.getElementById('status-text');
  const avPulse    = document.getElementById('avPulse');
  const avIdle     = document.getElementById('av-idle');
  const avA        = document.getElementById('av-a');
  const avB        = document.getElementById('av-b');
  const layout     = document.getElementById('layout');
  const header     = document.getElementById('app-header');

  /* ── anchor layout below fixed header ── */
  function anchorLayout() {
    const h = header.getBoundingClientRect().height;
    layout.style.top = h + 'px';
  }
  anchorLayout();
  window.addEventListener('resize', anchorLayout);

  /* ── auto-scroll: fires on ANY change inside chat-log ── */
  new MutationObserver(() => {
    chatLog.scrollTop = chatLog.scrollHeight;
  }).observe(chatLog, { childList: true, subtree: true, characterData: true });

  /* ── mobile keyboard: re-anchor when viewport shrinks ── */
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      const h = header.getBoundingClientRect().height;
      layout.style.top    = h + 'px';
      layout.style.height = (window.visualViewport.height - h) + 'px';
    });
  }

  /* ── textarea auto-grow ── */
  userInput.addEventListener('input', () => {
    userInput.style.height = '24px';
    const next = Math.min(userInput.scrollHeight, 120);
    userInput.style.height = next + 'px';
    userInput.style.overflowY = userInput.scrollHeight > 120 ? 'auto' : 'hidden';
  });

  /* ── avatar animation ── */
  let avTimer = null;
  function startAvatar() {
    avIdle.style.display = 'none';
    avA.style.display = 'block';
    avB.style.display = 'none';
    avPulse.classList.add('active');
    avTimer = setInterval(() => {
      const aShowing = avA.style.display === 'block';
      avA.style.display = aShowing ? 'none' : 'block';
      avB.style.display = aShowing ? 'block' : 'none';
    }, 400);
  }
  function stopAvatar() {
    clearInterval(avTimer);
    avTimer = null;
    avA.style.display = 'none';
    avB.style.display = 'none';
    avIdle.style.display = 'block';
    avPulse.classList.remove('active');
  }

  /* ── typing indicator ── */
  let typingEl = null;
  function showTyping() {
    typingEl = document.createElement('div');
    typingEl.className = 'msg bot';
    typingEl.innerHTML = '<div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    chatLog.appendChild(typingEl);
  }
  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  /* ── append message ── */
  function addMessage(text, role, extraClass) {
    const intro = chatLog.querySelector('.intro');
    if (intro) intro.remove();

    const row    = document.createElement('div');
    row.className = 'msg ' + role;
    const bub    = document.createElement('div');
    bub.className = 'bubble' + (extraClass ? ' ' + extraClass : '');
    bub.textContent = text;
    row.appendChild(bub);
    chatLog.appendChild(row);
  }

  /* ── send ── */
  let sending = false;

  async function send() {
    if (sending) return;
    const msg = userInput.value.trim();
    if (!msg) return;

    sending = true;
    addMessage(msg, 'user');
    userInput.value = '';
    userInput.style.height = '24px';
    userInput.disabled = true;
    sendBtn.disabled   = true;
    statusText.textContent = 'thinking…';

    startAvatar();
    showTyping();

    try {
      const res  = await fetch('/chat', {
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify({ message: msg })
      });
      const data  = await res.json();
      const reply = data.reply;

      hideTyping();
      stopAvatar();
      statusText.textContent = 'online · ready';

      if (reply === '__UNLOCK__') {
        addMessage('Yeah, That is true!!!', 'bot');
        setTimeout(() => { window.location.href = '/unlock'; }, 1500);
      } else {
        addMessage(reply, 'bot');
      }

    } catch (err) {
      hideTyping();
      stopAvatar();
      statusText.textContent = 'online · ready';
      addMessage('❌ Oops! I zoned out!!!', 'bot', 'error');
      console.error(err);
    }

    userInput.disabled = false;
    sendBtn.disabled   = false;
    sending = false;
    userInput.focus();
  }

  sendBtn.addEventListener('click', send);
  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  window.sendMessage = send;

})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('{{ url_for("static", filename="service-worker.js") }}')
        .then(r => console.log('SW:', r.scope))
        .catch(e => console.error('SW fail:', e));
    });
  }
</script>

</body>
</html>
